<svg xmlns="http://www.w3.org/2000/svg" width="900" height="335" viewBox="0 0 900 335">

<style>
  .ink{fill:#1d1a16}.paper{fill:#fbf6eb}.wash{fill:#eee3cf}.gold{fill:#dbc58f}
  .line{stroke:#1d1a16;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke:#1d1a16;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .dash{stroke-dasharray:9 7}
  .label{font:700 18px Arial,sans-serif;letter-spacing:1.5px;fill:#1d1a16}
  .small{font:15px Arial,sans-serif;fill:#4d473f}
  .tiny{font:12px Arial,sans-serif;fill:#4d473f}
  .title{font:700 18px Georgia,serif;fill:#1d1a16}
  .light{fill:#fbf6eb}
</style>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
    <path d="M0 0 L0 8 L10 4 Z" fill="#1d1a16"/>
  </marker>
</defs>
<text x="26" y="28" class="label">MANEUVER</text>
<!-- board -->
<g transform="translate(45 58)">
  <text x="95" y="0" text-anchor="middle" class="label">FRONT 1</text><text x="285" y="0" text-anchor="middle" class="label">FRONT 2</text><text x="475" y="0" text-anchor="middle" class="label">FRONT 3</text><text x="665" y="0" text-anchor="middle" class="label">FRONT 4</text>
  <path class="thin" d="M0 136 H760"/>
  <text x="760" y="129" text-anchor="end" class="tiny">FRONTLINE</text>
  <g fill="#f7efe0" stroke="#1d1a16" stroke-width="2">
    <rect x="20" y="38" width="150" height="95" rx="10"/><rect x="210" y="38" width="150" height="95" rx="10"/><rect x="400" y="38" width="150" height="95" rx="10"/><rect x="590" y="38" width="150" height="95" rx="10"/>
  </g>
  <!-- mini named stack in front 2 -->
  <g transform="translate(242 47)">
    <rect x="0" y="15" width="54" height="72" rx="6" class="paper" stroke="#1d1a16" stroke-width="2"/>
    <rect x="17" y="8" width="54" height="72" rx="6" class="paper" stroke="#1d1a16" stroke-width="2"/>
    <rect x="34" y="0" width="54" height="72" rx="6" class="paper" stroke="#1d1a16" stroke-width="2"/>
    <rect x="40" y="7" width="42" height="12" rx="2" class="ink"/><path class="thin" d="M48 39 Q61 26 74 39 Q61 53 48 39 Z"/>
  </g>
  <!-- curved handwritten move arrow -->
  <path class="line" d="M325 80 Q375 26 430 80" marker-end="url(#arrow)"/>
  <text x="380" y="44" text-anchor="middle" class="small">one Front</text>
</g>
<text x="420" y="225" text-anchor="middle" class="small">same rank • whole stack moves together</text>
<!-- swap vignette -->
<g transform="translate(150 245)">
  <text x="0" y="0" class="label">OCCUPIED?</text>
  <g transform="translate(165 -23)">
    <rect x="0" y="0" width="58" height="76" rx="6" class="paper" stroke="#1d1a16" stroke-width="2"/><rect x="9" y="9" width="40" height="12" rx="2" class="gold"/>
    <rect x="110" y="0" width="58" height="76" rx="6" class="paper" stroke="#1d1a16" stroke-width="2"/><rect x="119" y="9" width="40" height="12" rx="2" class="wash"/>
    <path class="line" d="M57 26 Q84 5 111 26" marker-end="url(#arrow)"/>
    <path class="line" d="M111 54 Q84 73 57 54" marker-end="url(#arrow)"/>
  </g>
  <text x="370" y="14" class="small">swap with your formation</text>
</g>
</svg>