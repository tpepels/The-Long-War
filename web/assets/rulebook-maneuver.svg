<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250">
<style>
.ink{fill:#1d1a16}.paper{fill:#fffaf0}.wash{fill:#eee3cf}.gold{fill:#d8c187}
.line{stroke:#1d1a16;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#1d1a16;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lab{font:700 19px Arial,sans-serif;letter-spacing:1px;fill:#1d1a16}
.mini{font:700 14px Arial,sans-serif;fill:#1d1a16}
.light{fill:#fffaf0}
</style>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4 Z" fill="#1d1a16"/></marker></defs>
<!-- four battlefield slots -->
<g transform="translate(18 28)">
<g fill="#f7efe0" stroke="#1d1a16" stroke-width="2"><rect x="0" y="0" width="128" height="92" rx="10"/><rect x="142" y="0" width="128" height="92" rx="10"/><rect x="284" y="0" width="128" height="92" rx="10"/><rect x="426" y="0" width="128" height="92" rx="10"/></g>
<text x="64" y="113" text-anchor="middle" class="mini">1</text><text x="206" y="113" text-anchor="middle" class="mini">2</text><text x="348" y="113" text-anchor="middle" class="mini">3</text><text x="490" y="113" text-anchor="middle" class="mini">4</text>
<g transform="translate(165 7) scale(0.55)"><g transform="translate(0 12) rotate(-6 40 55) scale(1)"><rect width="80" height="110" rx="8" class="paper" stroke="#1d1a16" stroke-width="3"/><rect x="8" y="8" width="64" height="18" rx="3" class="gold"/><text x="40" y="22" text-anchor="middle" class="mini">FORCE</text><path class="thin" d="M22 48 L58 84 M58 48 L22 84"/><circle cx="40" cy="66" r="7" class="paper" stroke="#1d1a16" stroke-width="2"/></g><g transform="translate(22 6) rotate(0 40 55) scale(1)"><rect width="80" height="110" rx="8" class="paper" stroke="#1d1a16" stroke-width="3"/><rect x="8" y="8" width="64" height="18" rx="3" class="wash"/><text x="40" y="22" text-anchor="middle" class="mini">BOND</text><circle cx="33" cy="66" r="14" class="thin"/><circle cx="48" cy="66" r="14" class="thin"/></g><g transform="translate(44 0) rotate(6 40 55) scale(1)"><rect width="80" height="110" rx="8" class="paper" stroke="#1d1a16" stroke-width="3"/><rect x="8" y="8" width="64" height="18" rx="3" class="ink"/><text x="40" y="22" text-anchor="middle" class="mini light">NAME</text><path class="thin" d="M20 65 Q40 46 60 65 Q40 86 20 65 Z"/></g></g>
<path class="line" d="M255 46 Q303 6 342 45" marker-end="url(#a)"/>
</g>
<text x="299" y="166" text-anchor="middle" class="lab">MOVE ONE FRONT SIDEWAYS</text>
<!-- swap -->
<g transform="translate(165 188)">
<g transform="translate(0 0) rotate(-4 40 55) scale(0.43)"><rect width="80" height="110" rx="8" class="paper" stroke="#1d1a16" stroke-width="3"/><rect x="8" y="8" width="64" height="18" rx="3" class="gold"/><text x="40" y="22" text-anchor="middle" class="mini">FORCE</text><path class="thin" d="M22 48 L58 84 M58 48 L22 84"/><circle cx="40" cy="66" r="7" class="paper" stroke="#1d1a16" stroke-width="2"/></g><g transform="translate(168 0) rotate(4 40 55) scale(0.43)"><rect width="80" height="110" rx="8" class="paper" stroke="#1d1a16" stroke-width="3"/><rect x="8" y="8" width="64" height="18" rx="3" class="wash"/><text x="40" y="22" text-anchor="middle" class="mini">BOND</text><circle cx="33" cy="66" r="14" class="thin"/><circle cx="48" cy="66" r="14" class="thin"/></g>
<path class="line" d="M49 13 Q97 -10 146 13" marker-end="url(#a)"/><path class="line" d="M146 42 Q97 65 49 42" marker-end="url(#a)"/>
