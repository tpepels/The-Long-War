<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<rect width="900" height="360" fill="#f5efe3"/>
<style>
text{fill:#181714;font-family:Arial,sans-serif} .h{font-size:22px;font-weight:700;letter-spacing:1px}.t{font-size:18px}.s{font-size:15px}.box{fill:#fffaf0;stroke:#181714;stroke-width:2}.soft{fill:#eee5d5;stroke:#181714;stroke-width:2}.dark{fill:#181714}.light{fill:#f7f2e8}.arrow{stroke:#181714;stroke-width:3;fill:none;marker-end:url(#a)} .dash{stroke-dasharray:8 7}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#181714"/></marker></defs>
<text x="35" y="42" class="h">BUILDING A POSITION</text>
<g transform="translate(35 75)">
 <text x="110" y="0" class="h" text-anchor="middle">PREPARED</text>
 <rect class="soft dash" x="25" y="25" width="170" height="58" rx="6"/><text x="110" y="60" class="t" text-anchor="middle">BOND</text>
 <rect class="soft dash" x="25" y="96" width="170" height="58" rx="6"/><text x="110" y="131" class="t" text-anchor="middle">NAME</text>
 <text x="110" y="184" class="s" text-anchor="middle">face-up • no Strength</text>
</g>
<path class="arrow" d="M265 178 H350"/>
<text x="307" y="155" class="s" text-anchor="middle">Force arrives</text>
<g transform="translate(370 75)">
 <text x="110" y="0" class="h" text-anchor="middle">FORMATION</text>
 <rect class="box" x="25" y="25" width="170" height="58" rx="6"/><text x="110" y="60" class="t" text-anchor="middle">FORCE</text>
 <rect class="soft" x="25" y="96" width="170" height="58" rx="6"/><text x="110" y="131" class="t" text-anchor="middle">BOND</text>
 <text x="110" y="184" class="s" text-anchor="middle">Force supplies Strength</text>
</g>
<path class="arrow" d="M600 178 H685"/>
<text x="642" y="155" class="s" text-anchor="middle">Name completes it</text>
<g transform="translate(700 75)">
 <text x="82" y="0" class="h" text-anchor="middle">NAMED</text>
 <rect class="box" x="0" y="25" width="165" height="48" rx="6"/><text x="82" y="55" class="t" text-anchor="middle">FORCE</text>
 <rect class="soft" x="0" y="83" width="165" height="48" rx="6"/><text x="82" y="113" class="t" text-anchor="middle">BOND</text>
 <rect class="dark" x="0" y="141" width="165" height="48" rx="6"/><text x="82" y="171" class="t light" text-anchor="middle">NAME</text>
 <text x="82" y="215" class="s" text-anchor="middle">persists • can Maneuver</text>
</g>
</svg>