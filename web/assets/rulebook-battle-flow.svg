<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<rect width="900" height="360" fill="#f5efe3"/>
<style>
text{fill:#181714;font-family:Arial,sans-serif} .h{font-size:22px;font-weight:700;letter-spacing:1px}.t{font-size:18px}.s{font-size:15px}.box{fill:#fffaf0;stroke:#181714;stroke-width:2}.soft{fill:#eee5d5;stroke:#181714;stroke-width:2}.dark{fill:#181714}.light{fill:#f7f2e8}.arrow{stroke:#181714;stroke-width:3;fill:none;marker-end:url(#a)} .dash{stroke-dasharray:8 7}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#181714"/></marker></defs>
<text x="35" y="42" class="h">ONE BATTLE</text>
<g transform="translate(35 82)">
  <rect class="box" x="0" y="0" width="145" height="70" rx="8"/><text x="72" y="31" text-anchor="middle" class="h">TURNS</text><text x="72" y="54" text-anchor="middle" class="s">draw + 1 operation</text>
  <path class="arrow" d="M150 35 H195"/>
  <rect class="soft" x="205" y="0" width="145" height="70" rx="8"/><text x="277" y="29" text-anchor="middle" class="h">PASS</text><text x="277" y="53" text-anchor="middle" class="s">then Pass again</text>
  <path class="arrow" d="M355 35 H400"/>
  <rect class="box" x="410" y="0" width="145" height="70" rx="8"/><text x="482" y="29" text-anchor="middle" class="h">RESOLVE</text><text x="482" y="53" text-anchor="middle" class="s">4 Fronts separately</text>
  <path class="arrow" d="M560 35 H605"/>
  <rect class="soft" x="615" y="0" width="145" height="70" rx="8"/><text x="687" y="29" text-anchor="middle" class="h">RETREAT</text><text x="687" y="53" text-anchor="middle" class="s">lost ground changes board</text>
</g>
<path class="arrow" d="M722 178 C722 225 670 230 620 230 H300"/>
<g transform="translate(35 230)">
  <rect class="box" x="0" y="0" width="190" height="70" rx="8"/><text x="95" y="29" text-anchor="middle" class="h">COLLAPSE CHECK</text><text x="95" y="53" text-anchor="middle" class="s">before recovery</text>
  <path class="arrow" d="M195 35 H255"/>
  <rect class="soft" x="265" y="0" width="190" height="70" rx="8"/><text x="360" y="29" text-anchor="middle" class="h">RECOVER</text><text x="360" y="53" text-anchor="middle" class="s">if the war continues</text>
  <path class="arrow" d="M460 35 H520"/>
  <rect class="box" x="530" y="0" width="195" height="70" rx="8"/><text x="627" y="29" text-anchor="middle" class="h">NEXT BATTLE</text><text x="627" y="53" text-anchor="middle" class="s">survivors stay in place</text>
</g>
</svg>