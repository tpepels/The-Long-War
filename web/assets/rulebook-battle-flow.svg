<svg xmlns="http://www.w3.org/2000/svg" width="600" height="170" viewBox="0 0 600 170">
<style>
.ink{fill:#1d1a16}.paper{fill:#fffaf0}.wash{fill:#eee3cf}.gold{fill:#d8c187}
.line{stroke:#1d1a16;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#1d1a16;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lab{font:700 19px Arial,sans-serif;letter-spacing:1px;fill:#1d1a16}
.mini{font:700 14px Arial,sans-serif;fill:#1d1a16}
.light{fill:#fffaf0}
</style>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4 Z" fill="#1d1a16"/></marker></defs>
<path class="line" d="M70 82 C120 40 170 40 220 82 S320 124 370 82 S470 40 535 82" marker-end="url(#a)"/>
<!-- turn card -->
<g transform="translate(20 33) rotate(-5 40 55) scale(0.62)"><rect width="80" height="110" rx="8" class="paper" stroke="#1d1a16" stroke-width="3"/><rect x="8" y="8" width="64" height="18" rx="3" class="gold"/><text x="40" y="22" text-anchor="middle" class="mini">FORCE</text><path class="thin" d="M22 48 L58 84 M58 48 L22 84"/><circle cx="40" cy="66" r="7" class="paper" stroke="#1d1a16" stroke-width="2"/></g>
<!-- pass tokens -->
<g transform="translate(147 54)"><circle cx="25" cy="25" r="23" class="paper" stroke="#1d1a16" stroke-width="3"/><circle cx="64" cy="25" r="23" class="ink"/><text x="25" y="31" text-anchor="middle" class="lab">P</text><text x="64" y="31" text-anchor="middle" class="lab light">P</text></g>
<!-- four fronts -->
<g transform="translate(282 43)" fill="#fffaf0" stroke="#1d1a16" stroke-width="2"><rect x="0" y="0" width="28" height="34" rx="4"/><rect x="35" y="0" width="28" height="34" rx="4"/><rect x="70" y="0" width="28" height="34" rx="4"/><rect x="105" y="0" width="28" height="34" rx="4"/><path d="M0 47 H133" fill="none"/><rect x="0" y="58" width="28" height="34" rx="4"/><rect x="35" y="58" width="28" height="34" rx="4"/><rect x="70" y="58" width="28" height="34" rx="4"/><rect x="105" y="58" width="28" height="34" rx="4"/></g>
<!-- retreat card -->
<g transform="translate(447 47) rotate(-7 35 45)"><rect width="58" height="80" rx="6" class="paper" stroke="#1d1a16" stroke-width="3"/><path class="line" d="M40 16 Q18 38 38 62" marker-end="url(#a)"/></g>
<!-- command dial -->
<g transform="translate(520 47)"><circle cx="38" cy="38" r="34" class="paper" stroke="#1d1a16" stroke-width="3"/><path class="line" d="M38 38 L57 19"/><circle cx="38" cy="38" r="4" class="ink"/></g>
<text x="50" y="155" text-anchor="middle" class="mini">TURN</text><text x="178" y="155" text-anchor="middle" class="mini">PASS</text><text x="348" y="155" text-anchor="middle" class="mini">FRONTS</text><text x="475" y="155" text-anchor="middle" class="mini">RETREAT</text><text x="558" y="155" text-anchor="middle" class="mini">COMMAND</text>
</svg>