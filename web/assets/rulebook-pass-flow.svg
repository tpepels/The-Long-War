<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310">

<style>
  .ink{fill:#1d1a16}.paper{fill:#fbf6eb}.wash{fill:#eee3cf}.gold{fill:#dbc58f}
  .line{stroke:#1d1a16;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke:#1d1a16;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .dash{stroke-dasharray:9 7}
  .label{font:700 18px Arial,sans-serif;letter-spacing:1.5px;fill:#1d1a16}
  .small{font:15px Arial,sans-serif;fill:#4d473f}
  .tiny{font:12px Arial,sans-serif;fill:#4d473f}
  .title{font:700 18px Georgia,serif;fill:#1d1a16}
  .light{fill:#fbf6eb}
</style>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
    <path d="M0 0 L0 8 L10 4 Z" fill="#1d1a16"/>
  </marker>
</defs>
<text x="26" y="28" class="label">A PASS IS ONLY PROVISIONAL</text>
<!-- players -->
<g transform="translate(55 70)">
  <circle cx="52" cy="48" r="35" class="wash" stroke="#1d1a16" stroke-width="3"/>
  <path class="thin" d="M36 45 Q52 60 68 45"/><circle cx="42" cy="38" r="2.5" class="ink"/><circle cx="62" cy="38" r="2.5" class="ink"/>
  <path class="thin" d="M24 92 Q52 74 80 92"/>
  <text x="52" y="128" text-anchor="middle" class="small">YOU</text>
</g>
<g transform="translate(345 70)">
  <circle cx="52" cy="48" r="35" class="paper" stroke="#1d1a16" stroke-width="3"/>
  <path class="thin" d="M36 45 Q52 60 68 45"/><circle cx="42" cy="38" r="2.5" class="ink"/><circle cx="62" cy="38" r="2.5" class="ink"/>
  <path class="thin" d="M24 92 Q52 74 80 92"/>
  <text x="52" y="128" text-anchor="middle" class="small">OPPONENT</text>
</g>
<!-- pass token -->
<g transform="translate(185 84) rotate(-7 44 44)">
  <circle cx="44" cy="44" r="40" class="ink"/><text x="44" y="51" text-anchor="middle" class="label light">PASS</text>
</g>
<path class="line" d="M286 129 H340" marker-end="url(#arrow)"/>
<!-- branch -->
<path class="line" d="M430 132 Q535 65 635 95" marker-end="url(#arrow)"/>
<path class="line" d="M430 145 Q535 224 635 215" marker-end="url(#arrow)"/>
<!-- top: opponent plays card -->
<g transform="translate(650 48) rotate(5 45 60)">
  <rect width="90" height="120" rx="9" class="paper" stroke="#1d1a16" stroke-width="3"/>
  <rect x="10" y="10" width="70" height="20" rx="3" class="gold"/><text x="45" y="25" text-anchor="middle" class="tiny">CARD</text>
  <path class="thin" d="M22 57 Q45 39 68 57 M22 82 Q45 64 68 82"/>
</g>
<text x="790" y="92" class="small">they act</text>
<text x="790" y="116" class="label">PASS CLEARS</text>
<!-- bottom: opponent pass -->
<g transform="translate(655 177)">
  <circle cx="42" cy="42" r="37" class="paper" stroke="#1d1a16" stroke-width="3"/><text x="42" y="48" text-anchor="middle" class="label">PASS</text>
</g>
<text x="790" y="207" class="small">they Pass</text>
<text x="790" y="232" class="label">BATTLE ENDS</text>
<path class="thin" d="M637 260 Q735 282 845 258"/>
</svg>