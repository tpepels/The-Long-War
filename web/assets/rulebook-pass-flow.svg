<svg xmlns="http://www.w3.org/2000/svg" width="600" height="225" viewBox="0 0 600 225">
<style>
.ink{fill:#1d1a16}.paper{fill:#fffaf0}.wash{fill:#eee3cf}.gold{fill:#d8c187}
.line{stroke:#1d1a16;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#1d1a16;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lab{font:700 19px Arial,sans-serif;letter-spacing:1px;fill:#1d1a16}
.mini{font:700 14px Arial,sans-serif;fill:#1d1a16}
.light{fill:#fffaf0}
</style>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4 Z" fill="#1d1a16"/></marker></defs>
<!-- you -->
<g transform="translate(28 57)"><circle cx="38" cy="38" r="31" class="wash" stroke="#1d1a16" stroke-width="3"/><circle cx="29" cy="32" r="2.5" class="ink"/><circle cx="47" cy="32" r="2.5" class="ink"/><path class="thin" d="M25 45 Q38 56 51 45"/></g>
<g transform="translate(110 55)"><circle cx="40" cy="40" r="35" class="ink"/><text x="40" y="47" text-anchor="middle" class="lab light">PASS</text></g>
<path class="line" d="M158 96 H214" marker-end="url(#a)"/>
<!-- opponent -->
<g transform="translate(218 57)"><circle cx="38" cy="38" r="31" class="paper" stroke="#1d1a16" stroke-width="3"/><circle cx="29" cy="32" r="2.5" class="ink"/><circle cx="47" cy="32" r="2.5" class="ink"/><path class="thin" d="M25 45 Q38 56 51 45"/></g>
<!-- branches -->
<path class="line" d="M292 83 Q348 38 397 55" marker-end="url(#a)"/>
<path class="line" d="M292 108 Q348 158 397 143" marker-end="url(#a)"/>
<!-- acts -->
<g transform="translate(405 14) rotate(6 40 55) scale(0.52)"><rect width="80" height="110" rx="8" class="paper" stroke="#1d1a16" stroke-width="3"/><rect x="8" y="8" width="64" height="18" rx="3" class="gold"/><text x="40" y="22" text-anchor="middle" class="mini">FORCE</text><path class="thin" d="M22 48 L58 84 M58 48 L22 84"/><circle cx="40" cy="66" r="7" class="paper" stroke="#1d1a16" stroke-width="2"/></g>
<text x="492" y="67" class="lab">PASS STAYS</text>
<!-- pass -->
<g transform="translate(405 118)"><circle cx="30" cy="30" r="27" class="paper" stroke="#1d1a16" stroke-width="3"/><text x="30" y="36" text-anchor="middle" class="mini">PASS</text></g>
<text x="492" y="154" class="lab">END BATTLE</text>
<text x="65" y="198" text-anchor="middle" class="mini">YOU</text><text x="256" y="198" text-anchor="middle" class="mini">OPPONENT</text>
</svg>