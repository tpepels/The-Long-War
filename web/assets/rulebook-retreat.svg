<svg xmlns="http://www.w3.org/2000/svg" width="900" height="345" viewBox="0 0 900 345">

<style>
  .ink{fill:#1d1a16}.paper{fill:#fbf6eb}.wash{fill:#eee3cf}.gold{fill:#dbc58f}
  .line{stroke:#1d1a16;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke:#1d1a16;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .dash{stroke-dasharray:9 7}
  .label{font:700 18px Arial,sans-serif;letter-spacing:1.5px;fill:#1d1a16}
  .small{font:15px Arial,sans-serif;fill:#4d473f}
  .tiny{font:12px Arial,sans-serif;fill:#4d473f}
  .title{font:700 18px Georgia,serif;fill:#1d1a16}
  .light{fill:#fbf6eb}
</style>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
    <path d="M0 0 L0 8 L10 4 Z" fill="#1d1a16"/>
  </marker>
</defs>
<text x="26" y="28" class="label">LOSING A FRONT</text>
<!-- before board -->
<g transform="translate(45 60)">
  <text x="125" y="0" text-anchor="middle" class="label">BEFORE</text>
  <rect x="25" y="25" width="200" height="90" rx="11" class="wash" stroke="#1d1a16" stroke-width="2"/><text x="38" y="48" class="tiny">REAR</text>
  <rect x="25" y="135" width="200" height="90" rx="11" class="paper" stroke="#1d1a16" stroke-width="3"/><text x="38" y="158" class="tiny">FRONTLINE</text>
  <!-- stacks -->
  <g transform="translate(88 43)"><rect x="0" y="10" width="54" height="63" rx="5" class="paper" stroke="#1d1a16" stroke-width="2"/><rect x="15" y="5" width="54" height="63" rx="5" class="paper" stroke="#1d1a16" stroke-width="2"/><rect x="30" width="54" height="63" rx="5" class="paper" stroke="#1d1a16" stroke-width="2"/><rect x="36" y="7" width="42" height="10" rx="2" class="ink"/></g>
  <g transform="translate(88 153)"><rect x="0" y="10" width="54" height="63" rx="5" class="paper" stroke="#1d1a16" stroke-width="2"/><rect x="15" y="5" width="54" height="63" rx="5" class="paper" stroke="#1d1a16" stroke-width="2"/><rect x="30" width="54" height="63" rx="5" class="paper" stroke="#1d1a16" stroke-width="2"/><rect x="36" y="7" width="42" height="10" rx="2" class="ink"/></g>
</g>
<!-- rear flies off -->
<path class="line" d="M285 112 Q355 46 420 74" marker-end="url(#arrow)"/>
<g transform="translate(402 44) rotate(14 50 40)">
  <rect x="0" y="0" width="75" height="92" rx="7" class="paper" stroke="#1d1a16" stroke-width="3"/>
  <path class="line" d="M12 15 L63 77 M63 15 L12 77"/>
</g>
<text x="390" y="154" text-anchor="middle" class="small">1. drive off Rear</text>
<!-- after board -->
<g transform="translate(610 60)">
  <text x="125" y="0" text-anchor="middle" class="label">AFTER</text>
  <rect x="25" y="25" width="200" height="90" rx="11" class="wash" stroke="#1d1a16" stroke-width="2"/><text x="38" y="48" class="tiny">REAR</text>
  <rect x="25" y="135" width="200" height="90" rx="11" class="paper" stroke="#1d1a16" stroke-width="3"/><text x="38" y="158" class="tiny">FRONTLINE</text>
  <g transform="translate(88 43)"><rect x="0" y="10" width="54" height="63" rx="5" class="paper" stroke="#1d1a16" stroke-width="2"/><rect x="15" y="5" width="54" height="63" rx="5" class="paper" stroke="#1d1a16" stroke-width="2"/><rect x="30" width="54" height="63" rx="5" class="paper" stroke="#1d1a16" stroke-width="2"/><rect x="36" y="7" width="42" height="10" rx="2" class="ink"/></g>
  <path class="line" d="M187 196 Q146 139 150 105" marker-end="url(#arrow)"/>
</g>
<text x="735" y="304" text-anchor="middle" class="small">2. Frontline Retreats into Rear</text>
<path class="thin" d="M560 65 Q534 176 555 278"/>
<text x="525" y="291" text-anchor="middle" class="tiny">rear first</text>
</svg>