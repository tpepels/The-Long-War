name: Deploy game site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "artifacts/*.json"
      - "rules/**"
      - "cards/**"
      - "decks/*.json"
      - "src/**"
      - "setup.py"
      - "pyproject.toml"
      - "tools/build_pages.py"
      - "tools/build_rulebook_pdf.py"
      - "tools/build_lab_report.py"
      - "tools/build_browser_runtime.py"
      - "tools/check_web_static.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Normalize Force art once
        shell: bash
        run: |
          if [[ -f web/art/v2/art-audit.json ]]; then
            echo "Force art audit already exists; skipping one-time normalization."
            exit 0
          fi
          python -m pip install "Pillow>=11.0"
          python tools/normalize_v2_art.py --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/art/v2/cards web/art/v2/art-audit.json web/art/v2/art-audit.csv
          if git diff --cached --quiet; then
            echo "No normalized art changes."
            exit 0
          fi
          git commit -m "Normalize Force art to shared V2 window"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git push origin HEAD:design/v2-physical-cards
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Install image decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: pip install -e '.[dev]'
      - name: Check shared physical card tests
        run: python -m pytest -q tests/test_v2_card_design.py tests/test_browser_card_layout.py
      - name: Check shared physical card layout
        run: python tools/check_card_layout.py --surface print --require-browser
      - run: python -m compileall -q src tools
      - name: Check authored browser assets
        run: python tools/check_web_static.py
      - name: Build Pages from committed Balance Lab evidence
        run: python tools/build_pages.py
      - name: Check built browser asset references
        run: python tools/check_web_static.py --dist dist
      - name: Build canonical rulebook PDF
        run: python tools/build_rulebook_pdf.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
