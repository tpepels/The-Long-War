name: Deploy print site

on:
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "rules/**"
      - "web/**"
      - "src/longwar/**"
      - "tools/build_pages.py"
      - "tools/analyze_telemetry.py"
      - "tools/simulate.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Generate dashboard telemetry
        run: >
          python tools/simulate.py
          --games 200
          --seed 91021
          --agent-a heuristic
          --agent-b heuristic
          --output artifacts/pages-selfplay.json
      - run: python tools/analyze_telemetry.py --simulation artifacts/pages-selfplay.json
      - run: python tools/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
