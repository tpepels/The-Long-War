name: Deploy game site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "artifacts/*.json"
      - "rules/**"
      - "cards/**"
      - "decks/*.json"
      - "src/**"
      - "setup.py"
      - "pyproject.toml"
      - "tools/build_pages.py"
      - "tools/run_experiments.py"
      - "tools/build_lab_report.py"
      - "tools/build_browser_runtime.py"
      - "tests/test_counterfactual.py"
      - "tests/test_playability.py"
      - "tests/test_targeted_counterfactual.py"
      - "tests/test_belief.py"
      - "tests/test_operation_constraints.py"
      - "tests/test_command_economy.py"
      - "tests/test_lab_report.py"
      - "tests/test_experiment_workflow.py"
      - "tests/test_telemetry.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q src tools tests
      - run: python -m pytest -q tests/test_counterfactual.py tests/test_playability.py tests/test_targeted_counterfactual.py tests/test_belief.py tests/test_operation_constraints.py
      - run: python -m pytest -q -m "not integration" tests/test_telemetry.py
      - run: python -m pytest -q tests/test_command_economy.py tests/test_lab_report.py
      - run: python -m pytest -q -m "not integration" tests/test_experiment_workflow.py
      - name: Regenerate online Balance Lab telemetry
        run: python tools/run_experiments.py balance --preset quick --games 100 --publish-lab
      - run: python tools/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
