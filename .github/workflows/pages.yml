name: Deploy print site

on:
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "rules/**"
      - "web/**"
      - "src/longwar/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Static balance
        run: python tools/balance_report.py
      - name: Heuristic self-play
        run: >
          python tools/simulate.py
          --games 300
          --seed 91021
          --agent-a heuristic
          --agent-b heuristic
          --output artifacts/heuristic-selfplay.json
      - name: Health analysis
        run: python tools/analyze_telemetry.py --simulation artifacts/heuristic-selfplay.json
      - name: Formal MCCFR verification
        run: python tools/verify_mccfr.py --iterations 30000
      - name: Train MCCFR policy
        run: >
          python tools/train_mccfr.py
          --iterations 50
          --depth 3
          --seed 6401
          --output artifacts/mccfr-policy.json
      - name: MCCFR vs heuristic
        run: >
          python tools/simulate.py
          --games 60
          --seed 7401
          --agent-a mccfr
          --policy-a artifacts/mccfr-policy.json
          --agent-b heuristic
          --output artifacts/mccfr-vs-heuristic.json
      - name: Heuristic vs MCCFR
        run: >
          python tools/simulate.py
          --games 60
          --seed 8401
          --agent-a heuristic
          --agent-b mccfr
          --policy-b artifacts/mccfr-policy.json
          --output artifacts/heuristic-vs-mccfr.json
      - name: Online MCCFR vs heuristic
        run: >
          python tools/simulate.py
          --games 6
          --seed 9401
          --agent-a online_mccfr
          --agent-b heuristic
          --online-iterations 4
          --online-depth 2
          --output artifacts/online-mccfr-vs-heuristic.json
      - name: Heuristic vs random
        run: >
          python tools/simulate.py
          --games 100
          --seed 2701
          --agent-a heuristic
          --agent-b random
          --output artifacts/heuristic-vs-random.json
      - name: Random vs heuristic
        run: >
          python tools/simulate.py
          --games 100
          --seed 3701
          --agent-a random
          --agent-b heuristic
          --output artifacts/random-vs-heuristic.json
      - name: Counterfactual card and interaction analysis
        run: >
          python tools/counterfactual_balance.py
          --contexts 3
          --games-per-context 4
          --bootstrap-resamples 750
          --seed 20260921
      - name: Aggregate Balance Lab
        run: python tools/build_lab_report.py
      - run: python tools/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
