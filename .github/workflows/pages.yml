name: Deploy print site

on:
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "rules/**"
      - "web/**"
      - "src/longwar/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Counterfactual Analysis"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Set per-run seed
        run: |
          RUN_SEED=$(( (GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT * 1000003) % 2000000000 + 1 ))
          echo "RUN_SEED=$RUN_SEED" >> "$GITHUB_ENV"
          echo "Run seed: $RUN_SEED"
      - name: Static balance
        run: python tools/balance_report.py
      - name: Heuristic self-play
        run: >
          python tools/simulate.py
          --games 300
          --seed $((RUN_SEED + 101))
          --agent-a heuristic
          --agent-b heuristic
          --output artifacts/heuristic-selfplay.json
      - name: Health analysis
        run: python tools/analyze_telemetry.py --simulation artifacts/heuristic-selfplay.json
      - name: Formal MCCFR verification
        run: python tools/verify_mccfr.py --iterations 30000
      - name: Train MCCFR policy
        run: >
          python tools/train_mccfr.py
          --iterations 50
          --depth 3
          --seed $((RUN_SEED + 201))
          --output artifacts/mccfr-policy.json
      - name: MCCFR vs heuristic
        run: >
          python tools/simulate.py
          --games 60
          --seed $((RUN_SEED + 301))
          --agent-a mccfr
          --policy-a artifacts/mccfr-policy.json
          --agent-b heuristic
          --output artifacts/mccfr-vs-heuristic.json
      - name: Heuristic vs MCCFR
        run: >
          python tools/simulate.py
          --games 60
          --seed $((RUN_SEED + 401))
          --agent-a heuristic
          --agent-b mccfr
          --policy-b artifacts/mccfr-policy.json
          --output artifacts/heuristic-vs-mccfr.json
      - name: Online MCCFR vs heuristic
        run: >
          python tools/simulate.py
          --games 6
          --seed $((RUN_SEED + 501))
          --agent-a online_mccfr
          --agent-b heuristic
          --online-iterations 4
          --online-depth 2
          --output artifacts/online-mccfr-vs-heuristic.json
      - name: Heuristic vs random
        run: >
          python tools/simulate.py
          --games 100
          --seed $((RUN_SEED + 601))
          --agent-a heuristic
          --agent-b random
          --output artifacts/heuristic-vs-random.json
      - name: Random vs heuristic
        run: >
          python tools/simulate.py
          --games 100
          --seed $((RUN_SEED + 701))
          --agent-a random
          --agent-b heuristic
          --output artifacts/random-vs-heuristic.json
      - name: Restore latest counterfactual reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh run list --workflow counterfactual.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$RUN_ID" ]; then
            echo "Restoring counterfactual reports from run $RUN_ID"
            gh run download "$RUN_ID" --name counterfactual-reports --dir artifacts
          else
            echo "No successful counterfactual analysis exists yet; continuing without it."
          fi
      - name: Aggregate Balance Lab
        run: python tools/build_lab_report.py
      - run: python tools/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
