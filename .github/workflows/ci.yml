name: CI

on:
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "decks/**"
      - "rules/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "web/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/**"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Set per-run seed
        run: |
          RUN_SEED=$(( (GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT * 1000003) % 2000000000 + 1 ))
          echo "RUN_SEED=$RUN_SEED" >> "$GITHUB_ENV"
          echo "Run seed: $RUN_SEED"
      - name: Browser JavaScript syntax
        run: |
          node --check web/play.js
          node --check web/play-worker.js
          node --check web/playtest-kit.js
          node --check web/cards.js
          node --check web/balance.js
      - name: Fast unit tests
        run: make test-fast
      - name: Algorithm learning tests
        run: make test-algorithm
      - name: Formal MCCFR verification
        run: python tools/verify_mccfr.py --iterations 30000
      - name: Integration tests
        run: make test-integration
      - name: Static balance report
        run: python tools/balance_report.py
      - name: Heuristic simulation smoke test
        run: >
          python tools/simulate.py
          --games 50
          --seed $((RUN_SEED + 101))
          --agent-a heuristic
          --agent-b heuristic
      - name: Analyze telemetry
        run: python tools/analyze_telemetry.py --simulation artifacts/simulation-report.json
      - name: MCCFR smoke training
        run: >
          python tools/train_mccfr.py
          --iterations 5
          --depth 2
          --seed $((RUN_SEED + 201))
          --output artifacts/mccfr-smoke.json
      - name: MCCFR smoke match
        run: >
          python tools/simulate.py
          --games 5
          --seed $((RUN_SEED + 202))
          --agent-a mccfr
          --policy-a artifacts/mccfr-smoke.json
          --agent-b heuristic
          --output artifacts/mccfr-smoke-match.json
      - name: Online MCCFR smoke match
        run: >
          python tools/simulate.py
          --games 2
          --seed $((RUN_SEED + 301))
          --agent-a online_mccfr
          --agent-b heuristic
          --online-iterations 2
          --online-depth 1
          --output artifacts/online-mccfr-smoke.json
      - name: Build lab aggregate
        run: python tools/build_lab_report.py
      - name: Build Pages
        run: python tools/build_pages.py
