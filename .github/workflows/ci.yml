name: Code checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "web/**"
      - "rules/**"
      - "cards/**"
      - "decks/**"
      - "setup.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: code-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search-contract:
    name: Generic search correctness (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Verify generic alpha-beta, ISMCTS, MCCFR and hidden-information contracts
        run: python -m pytest -q tests/test_generic_search.py tests/test_mccfr_reference.py

  native-search-performance:
    name: Native throughput, base vs adapter (measured)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml
      - name: Install common benchmark environment
        run: pip install -e './candidate[dev]'
      - name: Build and measure baseline engine
        run: |
          cd baseline
          PYTHONPATH="$PWD/src" make native-build WORKERS=2
          PYTHONPATH="$PWD/src" python ../candidate/tools/benchmark_native_search.py --root "$PWD" --output ../baseline.json
      - name: Build and measure adapter engine
        run: |
          cd candidate
          PYTHONPATH="$PWD/src" make native-build WORKERS=2
          PYTHONPATH="$PWD/src" python tools/benchmark_native_search.py --root "$PWD" --output ../candidate.json
      - name: Publish throughput and per-run distribution
        run: |
          python candidate/tools/compare_native_search_benchmarks.py baseline.json candidate.json --report search-throughput.md
          cat search-throughput.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-search-throughput
          path: |
            baseline.json
            candidate.json
            search-throughput.md
          if-no-files-found: ignore
          retention-days: 14
  native-search-parity:
    name: Native search/reference parity (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Build native algorithms with current adapter
        run: make native-build WORKERS=2
      - name: Compare native and reference search and information contracts
        run: python -m pytest -q --tb=short tests/test_native_search_parity.py

  sanity:
    name: Repository sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Check Python syntax
        run: python -m compileall -q src tools tests
      - name: Check undefined Python names
        run: python -m ruff check src tools tests --select F821,F822,F823
      - name: Check authored browser assets
        run: python tools/check_web_static.py
      - name: Report canonical PNG image dimensions
        run: python tools/audit_card_image_dimensions.py

  diagnostics:
    name: Development diagnostics (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Rebuild native runtime for diagnostics
        continue-on-error: true
        run: make native-build WORKERS=2
      - name: Focused positional regression diagnostics
        continue-on-error: true
        run: python -m pytest -q --tb=short tests/test_positional_overhaul.py
      - name: Generated-file diagnostics
        continue-on-error: true
        run: |
          python tools/build_native_protocol.py --check
          python tools/build_heuristic_weights.py --check
          python tools/build_native_fingerprint.py --check
          python tools/build_web_protocol.py --check
      - name: Core regression diagnostics
        continue-on-error: true
        run: make test-fast WORKERS=2
      - name: Research and evidence diagnostics
        continue-on-error: true
        run: python -m pytest -q --tb=short -m "research and not algorithm"
      - name: Algorithm diagnostics
        continue-on-error: true
        run: python -m pytest -q -n 2 --tb=short --maxfail=1 -m "algorithm"
      - name: Browser layout diagnostics
        continue-on-error: true
        run: python tools/check_game_layout.py --require-browser

  physical-site-build:
    name: Physical site build smoke (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - run: pip install -e '.[dev]'
      - name: Validate experimental paper D6 cards and decks
        run: python tools/check_paper_d6.py
      - name: Check coordinated D6 ensembles and unchanged outcome odds
        run: python tools/check_paper_d6_synergy.py
      - name: Check 2–5 Force costs and starter deployment budgets
        run: python tools/check_paper_d6_costs.py
      - name: Verify all Force identities and card-local interactions
        run: python tools/check_paper_d6_identity.py
      - name: Check permanent Holdings and immediate Tactics
        run: python tools/check_paper_d6_support.py
      - name: Validate canonical drawable Order deck
        run: python tools/check_paper_d6_orders.py
      - name: Check Order card print sizes and effects
        run: python tools/check_paper_d6_orders_layout.py
      - name: Validate all 44 printed D6 faces and card geometry
        run: python tools/check_paper_d6_layout.py
      - name: Require one-A4 canonical physical rules
        run: python -m pytest -q tests/test_rulebook_editorial_layout.py
      - name: Build inspection website
        env:
          TLW_PAGES_INSPECTION_ONLY: '1'
        run: python tools/build_pages.py
      - name: Check generated website
        run: python tools/check_web_static.py --dist dist
      - name: Build printable rulebook PDF
        run: python tools/build_rulebook_pdf.py
      - name: Upload rulebook preview for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rulebook-pdf-preview
          path: dist/rulebook.pdf
          if-no-files-found: ignore
          retention-days: 2
