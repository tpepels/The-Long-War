name: Code checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "web/**"
      - "rules/**"
      - "cards/**"
      - "decks/**"
      - "setup.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: code-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search-contract:
    name: Generic search correctness (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Verify generic alpha-beta, ISMCTS, MCCFR and hidden-information contracts
        run: python -m pytest -q tests/test_generic_search.py tests/test_mccfr_reference.py tests/test_search_solved_games.py

  native-search-performance:
    name: Native throughput, base vs adapter (measured)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml
      - name: Install common benchmark environment
        run: pip install -e './candidate[dev]'
      - name: Build and measure baseline engine
        run: |
          cd baseline
          PYTHONPATH="$PWD/src" make native-build WORKERS=2
          PYTHONPATH="$PWD/src" python ../candidate/tools/benchmark_native_search.py --root "$PWD" --output ../baseline.json
      - name: Build and measure adapter engine
        run: |
          cd candidate
          PYTHONPATH="$PWD/src" make native-build WORKERS=2
          PYTHONPATH="$PWD/src" python tools/benchmark_native_search.py --root "$PWD" --output ../candidate.json
      - name: Alternate benchmark order without rebuilding binaries
        run: |
          cd candidate
          PYTHONPATH="$PWD/src" python tools/benchmark_native_search.py --root "$PWD" --output ../candidate-repeat.json
          cd ../baseline
          PYTHONPATH="$PWD/src" python ../candidate/tools/benchmark_native_search.py --root "$PWD" --output ../baseline-repeat.json
      - name: Publish throughput and per-run distribution
        run: |
          python candidate/tools/compare_native_search_benchmarks.py baseline.json candidate.json --report search-throughput-first.md
          python candidate/tools/compare_native_search_benchmarks.py baseline.json candidate.json --baseline-recheck baseline-repeat.json --candidate-recheck candidate-repeat.json --report search-throughput.md
          cat search-throughput.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-search-throughput
          path: |
            baseline.json
            candidate.json
            baseline-repeat.json
            candidate-repeat.json
            search-throughput-first.md
            search-throughput.md
          if-no-files-found: ignore
          retention-days: 14
  native-solved-game-oracles:
    name: Native kernels solve independent games (required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Compile production search kernels against independent solved games
        run: python tools/build_native_solver_oracles.py
      - name: Verify native alpha-beta, ISMCTS and MCCFR against exact oracles
        run: python -m pytest -q --tb=short tests/test_native_solver_oracles.py

  engine-paper-battle-parity:
    name: Paper rule Battle Exhaustion (required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Compile current native engine
        run: make native-build WORKERS=2
      - name: Verify chosen Exhaustion, Guarded, Collapse and class inheritance
        run: python -m pytest -q --tb=short tests/test_paper_battle_exhaustion.py tests/test_basic_attack_conditions.py tests/test_pre_draw_pass.py

  engine-basic-attacks:
    name: Native basic Attacks and conditions (required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Compile updated native engine
        run: make native-build WORKERS=2
      - name: Verify basic Attacks and condition state
        run: python -m pytest -q --tb=short tests/test_basic_attack_conditions.py tests/test_pre_draw_pass.py

  engine-pre-draw-pass:
    name: Engine pre-draw Pass and closing (required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Build updated native engine and search
        run: make native-build WORKERS=2
      - name: Verify voluntary Pass before draw and two closing turns
        run: python -m pytest -q --tb=short tests/test_pre_draw_pass.py

  native-search-parity:
    name: Native search/reference parity (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Build native algorithms with current adapter
        run: make native-build WORKERS=2
      - name: Compare native and reference search and information contracts
        run: python -m pytest -q --tb=short tests/test_native_search_parity.py tests/test_search_engine_integration.py

  sanity:
    name: Repository sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Check Python syntax
        run: python -m compileall -q src tools tests
      - name: Check undefined Python names
        run: python -m ruff check src tools tests --select F821,F822,F823
      - name: Check authored browser assets
        run: python tools/check_web_static.py

  diagnostics:
    name: Development diagnostics (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Rebuild native runtime for diagnostics
        continue-on-error: true
        run: make native-build WORKERS=2
      - name: Focused positional regression diagnostics
        continue-on-error: true
        run: python -m pytest -q --tb=short tests/test_positional_overhaul.py
      - name: Generated-file diagnostics
        continue-on-error: true
        run: |
          python tools/build_native_protocol.py --check
          python tools/build_heuristic_weights.py --check
          python tools/build_native_fingerprint.py --check
          python tools/build_web_protocol.py --check
      - name: Core regression diagnostics
        continue-on-error: true
        run: make test-fast WORKERS=2
      - name: Research and evidence diagnostics
        continue-on-error: true
        run: python -m pytest -q --tb=short -m "research and not algorithm"
      - name: Algorithm diagnostics
        continue-on-error: true
        run: python -m pytest -q -n 2 --tb=short --maxfail=1 -m "algorithm"
      - name: Browser layout diagnostics
        continue-on-error: true
        run: python tools/check_game_layout.py --require-browser

  physical-site-build:
    name: Physical site build smoke (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - run: pip install -e '.[dev]'
      - name: Validate all printable cards
        run: python tools/check_print_cards.py
      - name: Audit readable physical card wording
        run: python tools/check_physical_wording.py
      - name: Audit Force price tariff (advisory)
        run: python tools/check_force_pricing.py
      - name: Audit Hero dual-mode prices (advisory)
        run: python tools/check_hero_pricing.py
      - name: Audit final print-only Strength and role balance
        run: python tools/check_final_balance.py
      - name: Audit 131-card pre-playtest usefulness and specialist coverage
        run: python tools/check_preplaytest_readiness.py
      - name: Check physical cost and choice scenarios
        run: python tools/check_physical_cost_balance.py
      - name: Check role-led Incursion and combined-Attack contracts
        run: python tools/check_tactical_battlefeel.py
      - name: Audit strict Force tariffs and post-Incursion mechanics
        run: python tools/check_post_incursion_economy.py
      - name: Check combo deck lists (advisory)
        run: python tools/check_physical_combo_decks.py
      - name: Smoke-check inline card icons (advisory)
        run: node tools/check_physical_rule_icons.cjs
      - name: Verify Hero price and rule geometry in Chromium
        run: python tools/check_hero_seal_layout.py
      - name: Verify compact exposed-edge cue geometry in Chromium
        run: python tools/check_edge_cue_layout.py
      - name: Self-test physical playtest metrics
        run: python tools/physical_playtest_metrics.py --self-test
      - name: Build inspection website
        env:
          TLW_PAGES_INSPECTION_ONLY: '1'
        run: python tools/build_pages.py
      - name: Check generated website
        run: python tools/check_web_static.py --dist dist
      - name: Build printable rulebook PDF
        run: python tools/build_rulebook_pdf.py
      - name: Upload rulebook preview for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rulebook-pdf-preview
          path: dist/rulebook.pdf
          if-no-files-found: ignore
          retention-days: 2
