name: CI

on:
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "decks/**"
      - "rules/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "web/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/**"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Fast unit tests
        run: make test-fast
      - name: Algorithm learning tests
        run: make test-algorithm
      - name: Formal MCCFR verification
        run: python tools/verify_mccfr.py --iterations 30000
      - name: Integration tests
        run: make test-integration
      - name: Static balance report
        run: python tools/balance_report.py
      - name: Heuristic simulation smoke test
        run: python tools/simulate.py --games 50 --seed 1701 --agent-a heuristic --agent-b heuristic
      - name: Analyze telemetry
        run: python tools/analyze_telemetry.py --simulation artifacts/simulation-report.json
      - name: MCCFR smoke training
        run: make mccfr-smoke
      - name: Build lab aggregate
        run: python tools/build_lab_report.py
      - name: Build Pages
        run: python tools/build_pages.py
