name: CI

on:
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "decks/**"
      - "rules/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "web/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/**"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Browser JavaScript syntax
        run: |
          node --check web/play.js
          node --check web/play-worker.js
          node --check web/playtest-kit.js
          node --check web/cards.js
          node --check web/balance.js
      - name: Fast unit tests
        run: make test-fast
      - name: Algorithm learning tests
        run: make test-algorithm
      - name: Formal MCCFR verification
        run: python tools/verify_mccfr.py --iterations 30000
      - name: Integration tests
        run: make test-integration
      - name: Static balance report
        run: python tools/balance_report.py
      - name: Heuristic simulation smoke test
        run: python tools/simulate.py --games 50 --seed 1701 --agent-a heuristic --agent-b heuristic
      - name: Analyze telemetry
        run: python tools/analyze_telemetry.py --simulation artifacts/simulation-report.json
      - name: MCCFR smoke training
        run: make mccfr-smoke
      - name: Online MCCFR smoke match
        run: >
          python tools/simulate.py
          --games 2
          --seed 9501
          --agent-a online_mccfr
          --agent-b heuristic
          --online-iterations 2
          --online-depth 1
          --output artifacts/online-mccfr-smoke.json
      - name: Counterfactual balance smoke test
        run: >
          python tools/counterfactual_balance.py
          --contexts 1
          --games-per-context 1
          --bootstrap-resamples 100
          --cards the-fifty-men followed namar
      - name: Targeted online MCCFR counterfactual smoke test
        run: >
          python tools/targeted_online_counterfactual.py
          --contexts 1
          --games-per-context 1
          --online-iterations 1
          --online-depth 1
          --max-cards 1
          --max-pairs 0
          --max-triples 0
          --bootstrap-resamples 100
          --force-top
      - name: Build lab aggregate
        run: python tools/build_lab_report.py
      - name: Build Pages
        run: python tools/build_pages.py
