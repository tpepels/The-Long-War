name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: python tools/balance_report.py
      - run: python tools/simulate.py --games 50 --seed 1701 --agent-a heuristic --agent-b heuristic
      - run: python tools/analyze_telemetry.py --simulation artifacts/simulation-report.json
      - name: MCCFR smoke training
        run: python tools/train_mccfr.py --iterations 2 --depth 2 --output artifacts/mccfr-smoke.json
      - name: MCCFR policy smoke match
        run: >
          python tools/simulate.py
          --games 5
          --seed 4401
          --agent-a mccfr
          --policy-a artifacts/mccfr-smoke.json
          --agent-b heuristic
          --output artifacts/mccfr-smoke-match.json
      - run: python tools/build_pages.py
