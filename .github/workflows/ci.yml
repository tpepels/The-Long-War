name: Code checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "cards/**"
      - "decks/**"
      - "setup.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: code-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Check generated native protocols
        run: |
          python tools/build_native_protocol.py --check
          python tools/build_heuristic_weights.py --check
          python tools/build_native_fingerprint.py --check
          python tools/build_web_protocol.py --check
      - name: Check undefined Python names
        run: python -m ruff check src tools tests --select F821,F822,F823
      - name: Run fast regression suite
        run: make test-fast WORKERS=2
      - name: Run ISMCTS heuristic/search regressions
        run: python -m pytest -q -n 2 --tb=short tests/test_ismcts.py tests/test_ismcts_validation.py
