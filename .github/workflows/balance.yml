name: Balance diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: balance-diagnostics
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Set per-run seed
        run: |
          RUN_SEED=$(( (GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT * 1000003) % 2000000000 + 1 ))
          echo "RUN_SEED=$RUN_SEED" >> "$GITHUB_ENV"
          echo "Run seed: $RUN_SEED"
      - name: Static balance
        run: python tools/balance_report.py
      - name: Heuristic self-play
        run: >
          python tools/simulate.py
          --games 750
          --seed $((RUN_SEED + 101))
          --agent-a heuristic
          --agent-b heuristic
          --output artifacts/heuristic-selfplay.json
      - name: Build human-playability statistics
        run: >
          python tools/playability_report.py
          artifacts/heuristic-selfplay.json
          --json-output artifacts/playability-report.json
          --markdown-output artifacts/playability-report.md
      - name: Build balance health report
        run: python tools/analyze_telemetry.py --simulation artifacts/heuristic-selfplay.json
      - name: Heuristic vs random
        run: >
          python tools/simulate.py
          --games 300
          --seed $((RUN_SEED + 601))
          --agent-a heuristic
          --agent-b random
          --output artifacts/heuristic-vs-random.json
      - name: Random vs heuristic
        run: >
          python tools/simulate.py
          --games 300
          --seed $((RUN_SEED + 701))
          --agent-a random
          --agent-b heuristic
          --output artifacts/random-vs-heuristic.json
      - name: Aggregate lab report
        run: python tools/build_lab_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: balance-reports
          path: artifacts/
          retention-days: 30
