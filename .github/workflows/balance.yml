name: Balance diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: balance-diagnostics
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Static balance
        run: python tools/balance_report.py
      - name: Heuristic self-play
        run: >
          python tools/simulate.py
          --games 500
          --seed 1701
          --agent-a heuristic
          --agent-b heuristic
          --output artifacts/heuristic-selfplay.json
      - name: Build balance health report
        run: python tools/analyze_telemetry.py --simulation artifacts/heuristic-selfplay.json
      - name: Formal MCCFR verification
        run: python tools/verify_mccfr.py --iterations 50000
      - name: Train MCCFR policy
        run: >
          python tools/train_mccfr.py
          --iterations 50
          --depth 3
          --seed 6401
          --output artifacts/mccfr-policy.json
      - name: MCCFR vs heuristic
        run: >
          python tools/simulate.py
          --games 100
          --seed 7401
          --agent-a mccfr
          --policy-a artifacts/mccfr-policy.json
          --agent-b heuristic
          --output artifacts/mccfr-vs-heuristic.json
      - name: Heuristic vs MCCFR
        run: >
          python tools/simulate.py
          --games 100
          --seed 8401
          --agent-a heuristic
          --agent-b mccfr
          --policy-b artifacts/mccfr-policy.json
          --output artifacts/heuristic-vs-mccfr.json
      - name: Online MCCFR vs heuristic
        run: >
          python tools/simulate.py
          --games 20
          --seed 9401
          --agent-a online_mccfr
          --agent-b heuristic
          --online-iterations 8
          --online-depth 2
          --output artifacts/online-mccfr-vs-heuristic.json
      - name: Heuristic vs random
        run: >
          python tools/simulate.py
          --games 300
          --seed 2701
          --agent-a heuristic
          --agent-b random
          --output artifacts/heuristic-vs-random.json
      - name: Random vs heuristic
        run: >
          python tools/simulate.py
          --games 300
          --seed 3701
          --agent-a random
          --agent-b heuristic
          --output artifacts/random-vs-heuristic.json
      - name: Aggregate lab report
        run: python tools/build_lab_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: balance-reports
          path: artifacts/
          retention-days: 30
