name: Balance diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "decks/**"
      - "src/longwar/**"
      - "tools/balance_report.py"
      - "tools/simulate.py"
      - ".github/workflows/balance.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python tools/balance_report.py
      - name: Heuristic self-play
        run: >
          python tools/simulate.py
          --games 500
          --seed 1701
          --agent-a heuristic
          --agent-b heuristic
          --output artifacts/heuristic-selfplay.json
      - name: Heuristic vs random
        run: >
          python tools/simulate.py
          --games 300
          --seed 2701
          --agent-a heuristic
          --agent-b random
          --output artifacts/heuristic-vs-random.json
      - name: Random vs heuristic
        run: >
          python tools/simulate.py
          --games 300
          --seed 3701
          --agent-a random
          --agent-b heuristic
          --output artifacts/random-vs-heuristic.json
      - uses: actions/upload-artifact@v4
        with:
          name: balance-reports
          path: artifacts/
          retention-days: 30
