name: Strategic Hand Curve

on:
  push:
    branches:
      - experiment/command-hand-deck-sweep
    paths:
      - ".github/workflows/strategic-hand-curve.yml"

permissions:
  contents: read

jobs:
  simulate:
    strategy:
      fail-fast: false
      matrix:
        hand: [10, 11, 12, 13]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Reference
        run: >
          python tools/simulate.py --games 50 --seed 26093210
          --deck-size 30 --hand-size ${{ matrix.hand }}
          --disable-draw --command
          --deck-a decks/experiments/name-rich-reference.json
          --deck-b decks/experiments/name-rich-reference.json
          --agent-a strategic_heuristic --agent-b strategic_heuristic
          --strategic-belief-samples 2 --strategic-rollout-plies 3 --strategic-candidate-width 5
          --output "artifacts/h${{ matrix.hand }}-reference.json"
      - name: Avaros
        run: >
          python tools/simulate.py --games 50 --seed 26093211
          --deck-size 30 --hand-size ${{ matrix.hand }}
          --disable-draw --command
          --deck-a decks/experiments/name-rich-avaros.json
          --deck-b decks/experiments/name-rich-avaros.json
          --agent-a strategic_heuristic --agent-b strategic_heuristic
          --strategic-belief-samples 2 --strategic-rollout-plies 3 --strategic-candidate-width 5
          --output "artifacts/h${{ matrix.hand }}-avaros.json"
      - name: Mara
        run: >
          python tools/simulate.py --games 50 --seed 26093212
          --deck-size 30 --hand-size ${{ matrix.hand }}
          --disable-draw --command
          --deck-a decks/experiments/name-rich-mara.json
          --deck-b decks/experiments/name-rich-mara.json
          --agent-a strategic_heuristic --agent-b strategic_heuristic
          --strategic-belief-samples 2 --strategic-rollout-plies 3 --strategic-candidate-width 5
          --output "artifacts/h${{ matrix.hand }}-mara.json"
      - name: Sera
        run: >
          python tools/simulate.py --games 50 --seed 26093213
          --deck-size 30 --hand-size ${{ matrix.hand }}
          --disable-draw --command
          --deck-a decks/experiments/name-rich-sera.json
          --deck-b decks/experiments/name-rich-sera.json
          --agent-a strategic_heuristic --agent-b strategic_heuristic
          --strategic-belief-samples 2 --strategic-rollout-plies 3 --strategic-candidate-width 5
          --output "artifacts/h${{ matrix.hand }}-sera.json"
      - uses: actions/upload-artifact@v4
        with:
          name: strategic-hand-h${{ matrix.hand }}
          path: artifacts/h${{ matrix.hand }}-*.json
          retention-days: 30

  summarize:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: strategic-hand-*
          path: artifacts/all
          merge-multiple: true
      - name: Summarize
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("artifacts/all")
          pat=re.compile(r"h(\d+)-(.+)\.json$")
          groups={}
          for p in root.glob("*.json"):
              m=pat.match(p.name)
              if not m: continue
              hand,_=m.groups()
              groups.setdefault(int(hand),[]).append(json.loads(p.read_text()))
          rows=[]
          for hand,rs in sorted(groups.items()):
              battles=sum(r["telemetry"]["battles"]["count"] for r in rs)
              games=sum(r["games"] for r in rs)
              def acts(name): return sum(r["telemetry"]["actions"].get(name,0) for r in rs)
              comps=sum(sum(v.get("completions",0) for v in r["telemetry"]["legend_combinations"].values()) for r in rs)
              dec=sum(r["telemetry"]["decisions"].get("strategic_heuristic",{}).get("decisions",0) for r in rs)
              choices=sum(
                  (r["telemetry"]["decisions"].get("strategic_heuristic",{}).get("mean_candidate_count") or 0)
                  *r["telemetry"]["decisions"].get("strategic_heuristic",{}).get("decisions",0)
                  for r in rs
              )/(dec or 1)
              rows.append({
                  "hand":hand,"games":games,"battles":battles,
                  "names_per_battle":acts("PlayName")/battles,
                  "completions_per_battle":comps/battles,
                  "cycles_per_battle":acts("Cycle")/battles,
                  "cards_per_battle":sum(acts(n) for n in ("PlaySubject","PlayLink","PlayName","PlayPlot","PlayScheme","SetStratagem"))/battles,
                  "choices":choices,
                  "first_player_wr":sum(r["first_player_win_rate"]*r["games"] for r in rs)/games,
              })
          out=Path("artifacts/summary");out.mkdir(parents=True,exist_ok=True)
          (out/"strategic-hand-curve.json").write_text(json.dumps(rows,indent=2)+"\n")
          lines=[
              "# Strategic hand curve — 30 cards / 6 Names / recycle","",
              "| Hand | Names/B | Target | Complete/B | Cycles/B | Cards/B | Choices | First-player WR |",
              "| ---: | ---: | :---: | ---: | ---: | ---: | ---: | ---: |",
          ]
          for r in rows:
              lines.append(
                  f"| {r['hand']} | {r['names_per_battle']:.2f} "
                  f"| {'YES' if r['names_per_battle']>=3 else 'no'} "
                  f"| {r['completions_per_battle']:.2f} | {r['cycles_per_battle']:.2f} "
                  f"| {r['cards_per_battle']:.2f} | {r['choices']:.1f} | {r['first_player_wr']:.1%} |"
              )
          (out/"strategic-hand-curve.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strategic-hand-curve-summary
          path: artifacts/summary/*
          retention-days: 30
