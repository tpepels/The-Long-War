name: Expanded Pool Playtest Gate

on:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Core 30 mirror
        run: python tools/simulate.py --games 5000 --seed 26092231 --deck-a decks/reference.json --deck-b decks/reference.json --agent-a heuristic --agent-b heuristic --output artifacts/gate-core30.json
      - name: Core 30 health
        run: python tools/analyze_telemetry.py --simulation artifacts/gate-core30.json --json-output artifacts/gate-core30-health.json --markdown-output artifacts/gate-core30-health.md
      - name: Avaros mirror
        run: python tools/simulate.py --games 2000 --seed 26092232 --deck-a decks/avaros-line.json --deck-b decks/avaros-line.json --agent-a heuristic --agent-b heuristic --output artifacts/gate-avaros-mirror.json
      - name: Mara mirror
        run: python tools/simulate.py --games 2000 --seed 26092233 --deck-a decks/mara-rear.json --deck-b decks/mara-rear.json --agent-a heuristic --agent-b heuristic --output artifacts/gate-mara-mirror.json
      - name: Sera mirror
        run: python tools/simulate.py --games 2000 --seed 26092234 --deck-a decks/sera-support.json --deck-b decks/sera-support.json --agent-a heuristic --agent-b heuristic --output artifacts/gate-sera-mirror.json
      - name: Avaros vs Mara
        run: |
          python tools/simulate.py --games 1500 --seed 26092235 --deck-a decks/avaros-line.json --deck-b decks/mara-rear.json --agent-a heuristic --agent-b heuristic --output artifacts/gate-avaros-mara-a.json
          python tools/simulate.py --games 1500 --seed 26092236 --deck-a decks/mara-rear.json --deck-b decks/avaros-line.json --agent-a heuristic --agent-b heuristic --output artifacts/gate-avaros-mara-b.json
      - name: Avaros vs Sera
        run: |
          python tools/simulate.py --games 1500 --seed 26092237 --deck-a decks/avaros-line.json --deck-b decks/sera-support.json --agent-a heuristic --agent-b heuristic --output artifacts/gate-avaros-sera-a.json
          python tools/simulate.py --games 1500 --seed 26092238 --deck-a decks/sera-support.json --deck-b decks/avaros-line.json --agent-a heuristic --agent-b heuristic --output artifacts/gate-avaros-sera-b.json
      - name: Mara vs Sera
        run: |
          python tools/simulate.py --games 1500 --seed 26092239 --deck-a decks/mara-rear.json --deck-b decks/sera-support.json --agent-a heuristic --agent-b heuristic --output artifacts/gate-mara-sera-a.json
          python tools/simulate.py --games 1500 --seed 26092240 --deck-a decks/sera-support.json --deck-b decks/mara-rear.json --agent-a heuristic --agent-b heuristic --output artifacts/gate-mara-sera-b.json
      - name: Build human-playability statistics
        run: >
          python tools/playability_report.py
          artifacts/gate-core30.json
          artifacts/gate-avaros-mirror.json
          artifacts/gate-mara-mirror.json
          artifacts/gate-sera-mirror.json
          artifacts/gate-avaros-mara-a.json
          artifacts/gate-avaros-mara-b.json
          artifacts/gate-avaros-sera-a.json
          artifacts/gate-avaros-sera-b.json
          artifacts/gate-mara-sera-a.json
          artifacts/gate-mara-sera-b.json
          --json-output artifacts/gate-playability.json
          --markdown-output artifacts/gate-playability.md
      - name: Full 48-card paired counterfactual sweep
        run: python tools/counterfactual_balance.py --contexts 10 --games-per-context 10 --no-pairs --no-triples --bootstrap-resamples 1200 --seed 26092241 --output artifacts/gate-counterfactual.json
      - name: Confirm red counterfactual outliers
        run: |
          python - <<'PY' > /tmp/red-card-ids.txt
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/gate-counterfactual.json").read_text())
          for row in report["cards"]:
              if row["level"] == "red":
                  print(row["id"])
          PY

          index=0
          while IFS= read -r card_id; do
            [ -n "$card_id" ] || continue
            seed=$((26092341 + index))
            python tools/counterfactual_balance.py \
              --contexts 20 \
              --games-per-context 12 \
              --no-pairs \
              --no-triples \
              --bootstrap-resamples 2000 \
              --seed "$seed" \
              --cards "$card_id" \
              --output "artifacts/gate-counterfactual-confirm-${card_id}.json"
            index=$((index + 1))
          done < /tmp/red-card-ids.txt
      - name: Evaluate playtest gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              return json.loads(Path("artifacts", name).read_text())

          failures=[]
          core=load("gate-core30.json")
          health=load("gate-core30-health.json")
          print("CORE30 first-player", core["first_player_win_rate"])
          print("CORE30 flags", health["summary"])
          if not 0.45 <= core["first_player_win_rate"] <= 0.55:
              failures.append("Core 30 first-player rate outside 45-55%")
          if health["summary"]["flags_high"] != 0:
              failures.append("Core 30 has high balance-health flags")

          mirrors={
              "Avaros": load("gate-avaros-mirror.json"),
              "Mara": load("gate-mara-mirror.json"),
              "Sera": load("gate-sera-mirror.json"),
          }
          for name, report in mirrors.items():
              rate=report["first_player_win_rate"]
              print(name, "mirror first-player", rate)
              if not 0.45 <= rate <= 0.55:
                  failures.append(f"{name} mirror first-player rate {rate:.3f}")

          pairs=[
              ("Avaros","Mara","gate-avaros-mara-a.json","gate-avaros-mara-b.json"),
              ("Avaros","Sera","gate-avaros-sera-a.json","gate-avaros-sera-b.json"),
              ("Mara","Sera","gate-mara-sera-a.json","gate-mara-sera-b.json"),
          ]
          for a,b,pa,pb in pairs:
              r1,r2=load(pa),load(pb)
              # a is P0 in r1 and P1 in r2.
              a_wins=r1["wins"][0]+r2["wins"][1]
              games=r1["games"]+r2["games"]
              rate=a_wins/games
              print(a,"vs",b,"seat-swapped",rate)
              if not 0.40 <= rate <= 0.60:
                  failures.append(f"{a} vs {b} deck rate {rate:.3f}")

          cf=load("gate-counterfactual.json")
          red=[row for row in cf["cards"] if row["level"]=="red"]
          orange=[row for row in cf["cards"] if row["level"]=="orange"]
          print("COUNTERFACTUAL red",[(r["title"],r["delta_win_probability"],r["ci95"]) for r in red])
          print("COUNTERFACTUAL orange",[(r["title"],r["delta_win_probability"],r["ci95"]) for r in orange])
          print("COUNTERFACTUAL top",[(r["title"],r["delta_win_probability"],r["ci95"],r["level"]) for r in cf["cards"][:15]])

          confirmed_red=[]
          for row in red:
              path=Path("artifacts", f"gate-counterfactual-confirm-{row['id']}.json")
              if not path.exists():
                  failures.append(f"Missing confirmation report for red card {row['title']}")
                  continue
              confirmation=json.loads(path.read_text())
              confirmed=next(item for item in confirmation["cards"] if item["id"]==row["id"])
              print(
                  "COUNTERFACTUAL confirmation",
                  row["title"],
                  confirmed["delta_win_probability"],
                  confirmed["ci95"],
                  confirmed["level"],
              )
              if confirmed["level"]=="red":
                  confirmed_red.append(confirmed)

          if confirmed_red:
              failures.append(
                  "Full-pool counterfactual sweep has independently confirmed red card outliers: "
                  + ", ".join(row["title"] for row in confirmed_red)
              )

          if failures:
              print("PLAYTEST GATE: FAIL")
              for item in failures:
                  print(" -",item)
              raise SystemExit(1)
          print("PLAYTEST GATE: PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expanded-playtest-gate
          path: artifacts/gate-*
          retention-days: 30
