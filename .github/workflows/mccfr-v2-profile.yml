name: MCCFR V2 Profile

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/profile_mccfr_callbacks.py"
      - ".github/workflows/mccfr-v2-profile.yml"

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: make check-native-mccfr
      - name: Depth 2 profile
        run: python tools/profile_mccfr_callbacks.py --iterations 60 --depth 2
      - name: Depth 3 profile
        run: python tools/profile_mccfr_callbacks.py --iterations 12 --depth 3
