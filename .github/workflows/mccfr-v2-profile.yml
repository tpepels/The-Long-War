name: MCCFR V2 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/longwar/**"
      - "tests/test_mccfr*.py"
      - "tests/test_online_mccfr.py"
      - "tests/test_parallel_mccfr.py"
      - "tools/benchmark_mccfr.py"
      - "tools/benchmark_parallel_mccfr.py"
      - ".github/workflows/mccfr-v2-profile.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: make check-native-mccfr
      - name: MCCFR algorithm and equivalence tests
        run: make test-algorithm
      - name: Formal Kuhn verification
        run: python tools/verify_mccfr.py --iterations 30000
      - name: Sequential depth 2 throughput
        run: python tools/benchmark_mccfr.py --iterations 120 --depth 2 --compare-python --compare-legacy
      - name: Sequential depth 3 throughput
        run: python tools/benchmark_mccfr.py --iterations 30 --depth 3
      - name: Parallel depth 2 throughput
        run: python tools/benchmark_parallel_mccfr.py --workers 0 --iterations 80 --depth 2
      - name: Parallel depth 3 throughput
        run: python tools/benchmark_parallel_mccfr.py --workers 0 --iterations 20 --depth 3
