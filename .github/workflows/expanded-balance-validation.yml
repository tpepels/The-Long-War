name: Expanded Pool Balance Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/expanded-balance-validation.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Core 30 mirror with mulligans
        run: python tools/simulate.py --games 10000 --seed 26092501 --agent-a heuristic --agent-b heuristic --output artifacts/core30-mulligan-selfplay.json
      - name: Core 30 health
        run: python tools/analyze_telemetry.py --simulation artifacts/core30-mulligan-selfplay.json --json-output artifacts/core30-mulligan-health.json --markdown-output artifacts/core30-mulligan-health.md
      - name: Core 30 paired card effects with mulligans
        run: |
          CARDS=$(python -c 'import json; print(" ".join(json.load(open("decks/reference.json"))["cards"]))')
          python tools/counterfactual_balance.py --contexts 12 --games-per-context 10 --no-pairs --no-triples --bootstrap-resamples 1500 --seed 26092502 --cards $CARDS --output artifacts/core30-mulligan-counterfactual.json
      - name: Print Core 30 gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sim=json.loads(Path('artifacts/core30-mulligan-selfplay.json').read_text())
          health=json.loads(Path('artifacts/core30-mulligan-health.json').read_text())
          cf=json.loads(Path('artifacts/core30-mulligan-counterfactual.json').read_text())
          print('CORE FIRST PLAYER', sim['first_player_win_rate'])
          print('CORE FLAGS', health['summary'])
          print('CORE GLOBAL', health['global']['flags'])
          print('CORE CARD FLAGS', [(c['title'],c['flags']) for c in health['cards'] if any(f['severity'] in {'high','watch'} for f in c['flags'])])
          print('CORE CAUSAL TOP')
          for row in cf['cards'][:12]:
              print(row['title'], row['delta_win_probability'], row['ci95'], row['level'], row['direction'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: core30-mulligan-balance
          path: artifacts/core30-mulligan-*
          retention-days: 30

  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Full 48-card causal sweep
        run: python tools/counterfactual_balance.py --contexts 8 --games-per-context 8 --no-pairs --no-triples --bootstrap-resamples 1000 --seed 26092503 --output artifacts/expanded-card-sweep.json
      - name: Print expanded card effects
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/expanded-card-sweep.json').read_text())
          print('EXPANDED CARD SWEEP matches', r['total_matches'])
          for row in r['cards']:
              print(row['title'], row['delta_win_probability'], row['ci95'], row['level'], row['direction'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: expanded-card-sweep
          path: artifacts/expanded-card-sweep.json
          retention-days: 30

  archetypes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Archetype round robin
        run: python tools/expanded_balance_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: expanded-archetype-round-robin
          path: artifacts/expanded-archetype-round-robin.json
          retention-days: 30

  solver-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: make check-native-mccfr
      - name: MCCFR native/reference parity and algorithm tests
        run: make test-algorithm
