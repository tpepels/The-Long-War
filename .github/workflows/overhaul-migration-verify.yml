name: Overhaul migration verification

on:
  push:
    branches:
      - rules/playtest-overhaul-engine

permissions:
  contents: read
  issues: write

concurrency:
  group: overhaul-migration-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'

      - name: Run migration gates
        id: gates
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/tlw-overhaul
          overall=0

          run_gate() {
            name="$1"
            shift
            log="/tmp/tlw-overhaul/${name}.log"
            echo "== ${name} =="
            "$@" >"${log}" 2>&1
            code=$?
            echo "${code}" >"/tmp/tlw-overhaul/${name}.status"
            if [ "${code}" -ne 0 ]; then
              overall=1
              echo "FAILED: ${name}"
              tail -n 120 "${log}"
            else
              echo "PASSED: ${name}"
            fi
          }

          run_gate generated bash -lc '
            python tools/build_native_protocol.py --check &&
            python tools/build_heuristic_weights.py --check &&
            python tools/build_native_fingerprint.py --check &&
            python tools/build_web_protocol.py --check &&
            python -m ruff check src tools tests --select F821,F822,F823 &&
            python tools/run_experiments.py validate-data
          '
          run_gate search_regressions bash -lc '
            python -m pytest -q -n 2 --tb=short               tests/test_command_economy.py               tests/test_heuristic_agent.py               tests/test_strategic_heuristic.py               tests/test_ismcts.py               tests/test_ismcts_validation.py
          '
          run_gate algorithms bash -lc '
            python -m pytest -q -n 2 --tb=short -m "algorithm"
          '
          run_gate fast bash -lc '
            make test-fast WORKERS=2
          '

          {
            echo "## Overhaul migration verification"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            for name in generated search_regressions algorithms fast; do
              code="$(cat "/tmp/tlw-overhaul/${name}.status")"
              if [ "${code}" -eq 0 ]; then
                echo "- ${name}: PASS"
              else
                echo "- ${name}: FAIL"
              fi
            done
            for name in generated search_regressions algorithms fast; do
              code="$(cat "/tmp/tlw-overhaul/${name}.status")"
              if [ "${code}" -ne 0 ]; then
                echo
                echo "<details><summary>${name} failure tail</summary>"
                echo
                echo '~~~text'
                tail -n 120 "/tmp/tlw-overhaul/${name}.log"
                echo '~~~'
                echo "</details>"
              fi
            done
          } > /tmp/tlw-overhaul/report.md

          exit "${overall}"

      - name: Post verification report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          body = open("/tmp/tlw-overhaul/report.md", encoding="utf-8").read()
          request = urllib.request.Request(
              "https://api.github.com/repos/${{ github.repository }}/issues/73/comments",
              data=json.dumps({"body": body}).encode(),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              print(response.status)
          PY

      - name: Fail verification job
        if: steps.gates.outcome == 'failure'
        run: exit 1
