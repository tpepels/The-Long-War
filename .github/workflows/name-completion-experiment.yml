name: Name Completion Experiment

on:
  push:
    branches:
      - experiment/name-completion-sweep
    paths:
      - "src/longwar/game/engine.py"
      - "tools/simulate.py"
      - "tools/playability_report.py"
      - "tests/test_engine.py"
      - "decks/experiments/name-rich-*.json"
      - ".github/workflows/name-completion-experiment.yml"

permissions:
  contents: read

jobs:
  simulate:
    strategy:
      fail-fast: false
      matrix:
        hand_size: [9, 10, 11]
        variant: [current, rich, rich_draw]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Variant regression
        run: pytest -q tests/test_engine.py tests/test_simulation.py
      - name: Choose variant
        run: |
          if [ "${{ matrix.variant }}" = "current" ]; then
            echo "REF_DECK=decks/reference.json" >> "$GITHUB_ENV"
            echo "AVAROS_DECK=decks/avaros-line.json" >> "$GITHUB_ENV"
            echo "MARA_DECK=decks/mara-rear.json" >> "$GITHUB_ENV"
            echo "SERA_DECK=decks/sera-support.json" >> "$GITHUB_ENV"
            echo "COMPLETION_ARGS=" >> "$GITHUB_ENV"
          else
            echo "REF_DECK=decks/experiments/name-rich-reference.json" >> "$GITHUB_ENV"
            echo "AVAROS_DECK=decks/experiments/name-rich-avaros.json" >> "$GITHUB_ENV"
            echo "MARA_DECK=decks/experiments/name-rich-mara.json" >> "$GITHUB_ENV"
            echo "SERA_DECK=decks/experiments/name-rich-sera.json" >> "$GITHUB_ENV"
            if [ "${{ matrix.variant }}" = "rich_draw" ]; then
              echo "COMPLETION_ARGS=--completion-draw-names oren iria teyra" >> "$GITHUB_ENV"
            else
              echo "COMPLETION_ARGS=" >> "$GITHUB_ENV"
            fi
          fi
      - name: Reference mirror
        run: >
          python tools/simulate.py --games 1000 --seed 26092410
          --hand-size ${{ matrix.hand_size }} --disable-draw
          $COMPLETION_ARGS
          --deck-a "$REF_DECK" --deck-b "$REF_DECK"
          --agent-a heuristic --agent-b heuristic
          --output artifacts/${{ matrix.variant }}-${{ matrix.hand_size }}-reference.json
      - name: Avaros mirror
        run: >
          python tools/simulate.py --games 1000 --seed 26092411
          --hand-size ${{ matrix.hand_size }} --disable-draw
          $COMPLETION_ARGS
          --deck-a "$AVAROS_DECK" --deck-b "$AVAROS_DECK"
          --agent-a heuristic --agent-b heuristic
          --output artifacts/${{ matrix.variant }}-${{ matrix.hand_size }}-avaros.json
      - name: Mara mirror
        run: >
          python tools/simulate.py --games 1000 --seed 26092412
          --hand-size ${{ matrix.hand_size }} --disable-draw
          $COMPLETION_ARGS
          --deck-a "$MARA_DECK" --deck-b "$MARA_DECK"
          --agent-a heuristic --agent-b heuristic
          --output artifacts/${{ matrix.variant }}-${{ matrix.hand_size }}-mara.json
      - name: Sera mirror
        run: >
          python tools/simulate.py --games 1000 --seed 26092413
          --hand-size ${{ matrix.hand_size }} --disable-draw
          $COMPLETION_ARGS
          --deck-a "$SERA_DECK" --deck-b "$SERA_DECK"
          --agent-a heuristic --agent-b heuristic
          --output artifacts/${{ matrix.variant }}-${{ matrix.hand_size }}-sera.json
      - name: Aggregate playability
        run: >
          python tools/playability_report.py
          artifacts/${{ matrix.variant }}-${{ matrix.hand_size }}-reference.json
          artifacts/${{ matrix.variant }}-${{ matrix.hand_size }}-avaros.json
          artifacts/${{ matrix.variant }}-${{ matrix.hand_size }}-mara.json
          artifacts/${{ matrix.variant }}-${{ matrix.hand_size }}-sera.json
          --json-output artifacts/${{ matrix.variant }}-${{ matrix.hand_size }}-playability.json
          --markdown-output artifacts/${{ matrix.variant }}-${{ matrix.hand_size }}-playability.md
      - uses: actions/upload-artifact@v4
        with:
          name: name-completion-${{ matrix.variant }}-${{ matrix.hand_size }}
          path: artifacts/${{ matrix.variant }}-${{ matrix.hand_size }}-*
          retention-days: 30
