name: Deploy Balance Lab

on:
  push:
    branches:
      - balance-lab-progression

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - name: Build Balance Lab site
        run: |
          set -e
          mkdir -p _site

          cp web/balance.html _site/index.html
          cp web/balance.js _site/
          cp web/style.css _site/

          test -f artifacts/lab-report.json
          test -f artifacts/balance-health.json
          test -f artifacts/balance-report.json

          cp artifacts/lab-report.json _site/
          cp artifacts/balance-health.json _site/
          cp artifacts/balance-report.json _site/

          cp artifacts/heuristic-selfplay.json _site/ || true
          cp artifacts/progression-selfplay.json _site/ || true
          cp artifacts/playability-report.json _site/ || true
          cp artifacts/counterfactual-balance.json _site/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
