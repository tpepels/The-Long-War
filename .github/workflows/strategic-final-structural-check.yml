name: Strategic Final Structural Check

on:
  push:
    branches:
      - experiment/command-hand-deck-sweep
    paths:
      - ".github/workflows/strategic-final-structural-check.yml"

permissions:
  contents: read

jobs:
  simulate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: recycle, persistent: false}
          - {id: persistent-empty, persistent: true}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Configure
        run: |
          if [ "${{ matrix.persistent }}" = "true" ]; then
            echo "DECK_ARGS=--no-between-battle-recycle --reshuffle-on-empty" >> "$GITHUB_ENV"
          else
            echo "DECK_ARGS=" >> "$GITHUB_ENV"
          fi
      - name: Reference
        run: >
          python tools/simulate.py --games 25 --seed 26093610
          --deck-size 30 --hand-size 10
          --disable-draw --command $DECK_ARGS
          --deck-a decks/experiments/name-rich-reference.json
          --deck-b decks/experiments/name-rich-reference.json
          --agent-a strategic_heuristic --agent-b strategic_heuristic
          --strategic-belief-samples 3 --strategic-rollout-plies 4 --strategic-candidate-width 6
          --output "artifacts/${{ matrix.id }}-reference.json"
      - name: Avaros
        run: >
          python tools/simulate.py --games 25 --seed 26093611
          --deck-size 30 --hand-size 10
          --disable-draw --command $DECK_ARGS
          --deck-a decks/experiments/name-rich-avaros.json
          --deck-b decks/experiments/name-rich-avaros.json
          --agent-a strategic_heuristic --agent-b strategic_heuristic
          --strategic-belief-samples 3 --strategic-rollout-plies 4 --strategic-candidate-width 6
          --output "artifacts/${{ matrix.id }}-avaros.json"
      - name: Mara
        run: >
          python tools/simulate.py --games 25 --seed 26093612
          --deck-size 30 --hand-size 10
          --disable-draw --command $DECK_ARGS
          --deck-a decks/experiments/name-rich-mara.json
          --deck-b decks/experiments/name-rich-mara.json
          --agent-a strategic_heuristic --agent-b strategic_heuristic
          --strategic-belief-samples 3 --strategic-rollout-plies 4 --strategic-candidate-width 6
          --output "artifacts/${{ matrix.id }}-mara.json"
      - name: Sera
        run: >
          python tools/simulate.py --games 25 --seed 26093613
          --deck-size 30 --hand-size 10
          --disable-draw --command $DECK_ARGS
          --deck-a decks/experiments/name-rich-sera.json
          --deck-b decks/experiments/name-rich-sera.json
          --agent-a strategic_heuristic --agent-b strategic_heuristic
          --strategic-belief-samples 3 --strategic-rollout-plies 4 --strategic-candidate-width 6
          --output "artifacts/${{ matrix.id }}-sera.json"
      - uses: actions/upload-artifact@v4
        with:
          name: final-structural-${{ matrix.id }}
          path: artifacts/${{ matrix.id }}-*.json
          retention-days: 30

  summarize:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: final-structural-*
          path: artifacts/all
          merge-multiple: true
      - name: Summarize
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/all")
          rows=[]
          for mode in ("recycle","persistent-empty"):
              rs=[json.loads(p.read_text()) for p in root.glob(f"{mode}-*.json")]
              battles=sum(r["telemetry"]["battles"]["count"] for r in rs)
              games=sum(r["games"] for r in rs)
              acts=lambda n:sum(r["telemetry"]["actions"].get(n,0) for r in rs)
              comps=sum(sum(v.get("completions",0) for v in r["telemetry"]["legend_combinations"].values()) for r in rs)
              dec=sum(r["telemetry"]["decisions"].get("strategic_heuristic",{}).get("decisions",0) for r in rs)
              choices=sum(
                  (r["telemetry"]["decisions"].get("strategic_heuristic",{}).get("mean_candidate_count") or 0)
                  * r["telemetry"]["decisions"].get("strategic_heuristic",{}).get("decisions",0)
                  for r in rs
              )/(dec or 1)
              dep=lambda field:sum((r["telemetry"]["depletion"].get(field) or 0)*r["games"] for r in rs)/(games or 1)
              rows.append({
                  "mode":mode,"games":games,"battles":battles,
                  "names_per_battle":acts("PlayName")/battles,
                  "completions_per_battle":comps/battles,
                  "cycles_per_battle":acts("Cycle")/battles,
                  "cards_per_battle":sum(acts(n) for n in ("PlaySubject","PlayLink","PlayName","PlayPlot","PlayScheme","SetStratagem"))/battles,
                  "choices":choices,
                  "reshuffle_player_rate":dep("player_game_reshuffle_rate"),
                  "first_player_wr":sum(r["first_player_win_rate"]*r["games"] for r in rs)/games,
              })
          out=Path("artifacts/summary");out.mkdir(parents=True,exist_ok=True)
          (out/"strategic-final-structural-check.json").write_text(json.dumps(rows,indent=2)+"\n")
          lines=[
              "# Strategic final structural check","",
              "6 Names / 30 cards / hand 10 / Command, using 3 belief samples, 4 rollout plies, width 6.","",
              "| Mode | Names/B | Target | Complete/B | Cycles/B | Cards/B | Choices | Players reshuffling | First-player WR |",
              "| --- | ---: | :---: | ---: | ---: | ---: | ---: | ---: | ---: |",
          ]
          for r in rows:
              lines.append(
                  f"| {r['mode']} | {r['names_per_battle']:.2f} | {'YES' if r['names_per_battle']>=3 else 'no'} "
                  f"| {r['completions_per_battle']:.2f} | {r['cycles_per_battle']:.2f} | {r['cards_per_battle']:.2f} "
                  f"| {r['choices']:.1f} | {r['reshuffle_player_rate']:.1%} | {r['first_player_wr']:.1%} |"
              )
          (out/"strategic-final-structural-check.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strategic-final-structural-summary
          path: artifacts/summary/*
          retention-days: 30
