name: Eight Name 36 Persistent Sweep

on:
  push:
    branches:
      - experiment/command-hand-deck-sweep
    paths:
      - "decks/experiments/eight-name-36-*.json"
      - ".github/workflows/eight-name-36-persistent-sweep.yml"

permissions:
  contents: read

jobs:
  simulate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: h12-r, hand: 12, mode: recycle}
          - {id: h13-r, hand: 13, mode: recycle}
          - {id: h14-r, hand: 14, mode: recycle}
          - {id: h12-p, hand: 12, mode: persistent}
          - {id: h13-p, hand: 13, mode: persistent}
          - {id: h14-p, hand: 14, mode: persistent}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Simulate cell
        env:
          HAND: ${{ matrix.hand }}
          MODE: ${{ matrix.mode }}
          CELL: ${{ matrix.id }}
        run: |
          python - <<'PY'
          import json,os
          from dataclasses import asdict
          from pathlib import Path
          from longwar.cards import load_card_file
          from longwar.game import GameEngine
          from longwar.simulate import simulate_games

          hand=int(os.environ["HAND"])
          recycle=os.environ["MODE"]=="recycle"
          cell=os.environ["CELL"]
          data=load_card_file(Path("cards/experiments/eight-name-cards.json"))
          engine=GameEngine(
              data,
              opening_hand_size=hand,
              draw_action_enabled=False,
              deck_size=36,
              recycle_between_battles=recycle,
              command_enabled=True,
              starting_command=20,
              battle_command_gain=10,
              command_cap=20,
              cycle_command_cost=1,
          )
          profiles={
              "reference":("decks/experiments/eight-name-36-reference.json",26093210),
              "avaros":("decks/experiments/eight-name-36-avaros.json",26093211),
              "mara":("decks/experiments/eight-name-36-mara.json",26093212),
              "sera":("decks/experiments/eight-name-36-sera.json",26093213),
          }
          out=Path("artifacts");out.mkdir(exist_ok=True)
          for name,(deck_path,seed) in profiles.items():
              deck=json.loads(Path(deck_path).read_text())["cards"]
              engine.validate_deck(deck)
              assert sum(engine.cards[c]["type"]=="name" for c in deck)==8
              report=simulate_games(
                  engine,deck,deck,
                  games=250,seed=seed,
                  agent_names=("heuristic","heuristic"),
              )
              payload=asdict(report)
              payload["first_player_win_rate"]=report.first_player_win_rate
              (out/f"{cell}-{name}.json").write_text(json.dumps(payload,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eight36-${{ matrix.id }}
          path: artifacts/${{ matrix.id }}-*.json
          retention-days: 30

  summarize:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eight36-*
          path: artifacts/all
          merge-multiple: true
      - name: Summarize
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("artifacts/all")
          pat=re.compile(r"h(\d+)-([rp])-(.+)\.json$")
          groups={}
          for p in root.glob("*.json"):
              m=pat.match(p.name)
              if not m: continue
              hand,mode,_=m.groups()
              key=(int(hand),"recycle" if mode=="r" else "persistent")
              groups.setdefault(key,[]).append(json.loads(p.read_text()))
          rows=[]
          for (hand,mode),rs in sorted(groups.items()):
              battles=sum(r["telemetry"]["battles"]["count"] for r in rs)
              games=sum(r["games"] for r in rs)
              acts=lambda n:sum(r["telemetry"]["actions"].get(n,0) for r in rs)
              comps=sum(sum(v.get("completions",0) for v in r["telemetry"]["legend_combinations"].values()) for r in rs)
              ex=sum((r["telemetry"]["depletion"]["player_game_deck_exhaustion_rate"] or 0)*r["games"] for r in rs)/games
              cont=sum(r["telemetry"]["battles"]["continuing_battles"] for r in rs)
              short=sum((r["telemetry"]["battles"]["next_battle_player_shortfall_rate"] or 0)*r["telemetry"]["battles"]["continuing_battles"] for r in rs)/(cont or 1)
              dec=sum(r["telemetry"]["decisions"].get("heuristic",{}).get("decisions",0) for r in rs)
              choices=sum((r["telemetry"]["decisions"].get("heuristic",{}).get("mean_candidate_count") or 0)*r["telemetry"]["decisions"].get("heuristic",{}).get("decisions",0) for r in rs)/(dec or 1)
              rows.append({
                  "hand":hand,"mode":mode,"games":games,"battles":battles,
                  "names_per_battle":acts("PlayName")/battles,
                  "completions_per_battle":comps/battles,
                  "cycles_per_battle":acts("Cycle")/battles,
                  "cards_per_battle":sum(acts(n) for n in ("PlaySubject","PlayLink","PlayName","PlayPlot","PlayScheme","SetStratagem"))/battles,
                  "choices":choices,
                  "deck_exhaustion":ex,
                  "refill_shortfall":short,
              })
          out=Path("artifacts/summary");out.mkdir(parents=True,exist_ok=True)
          (out/"eight-name-36.json").write_text(json.dumps(rows,indent=2)+"\n")
          lines=[
              "# Eight-Name 36-card sweep","",
              "| Hand | Mode | Names/B | Target | Complete/B | Cycles/B | Cards/B | Choices | Deck exhaust | Refill shortfall |",
              "| ---: | --- | ---: | :---: | ---: | ---: | ---: | ---: | ---: | ---: |",
          ]
          for r in rows:
              lines.append(
                  f"| {r['hand']} | {r['mode']} | {r['names_per_battle']:.2f} | {'YES' if r['names_per_battle']>=3 else 'no'} "
                  f"| {r['completions_per_battle']:.2f} | {r['cycles_per_battle']:.2f} | {r['cards_per_battle']:.2f} "
                  f"| {r['choices']:.1f} | {r['deck_exhaustion']:.1%} | {r['refill_shortfall']:.1%} |"
              )
          (out/"eight-name-36.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eight-name-36-summary
          path: artifacts/summary/*
          retention-days: 30
