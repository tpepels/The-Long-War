name: Normalize V2 card art

on:
  push:
    branches: [main]
    paths:
      - "tools/normalize_v2_art.py"
      - ".github/workflows/normalize-v2-art.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "Pillow>=11.0"
      - name: Audit and normalize card art
        run: python tools/normalize_v2_art.py --write
      - name: Commit normalized Force art
        shell: bash
        run: |
          if git diff --quiet -- web/art/v2/cards web/art/v2/art-audit.json web/art/v2/art-audit.csv; then
            echo "No art changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/art/v2/cards web/art/v2/art-audit.json web/art/v2/art-audit.csv
          git commit -m "Normalize Force art to shared V2 window"
          git push origin HEAD:main HEAD:design/v2-physical-cards
