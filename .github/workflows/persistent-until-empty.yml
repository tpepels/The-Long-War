name: Persistent Until Empty

on:
  push:
    branches:
      - experiment/command-hand-deck-sweep
    paths:
      - ".github/workflows/persistent-until-empty.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Regression
        run: >
          pytest -q
          tests/test_reshuffle_on_empty.py
          tests/test_command_economy.py
          tests/test_engine.py
          tests/test_simulation.py

  simulate:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        hand: [12, 13, 14]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Reference
        run: >
          python tools/simulate.py --games 250 --seed 26093110
          --deck-size 30 --hand-size ${{ matrix.hand }}
          --disable-draw --command
          --no-between-battle-recycle --reshuffle-on-empty
          --deck-a decks/experiments/seven-name-reference.json
          --deck-b decks/experiments/seven-name-reference.json
          --agent-a heuristic --agent-b heuristic
          --output "artifacts/h${{ matrix.hand }}-empty-reference.json"
      - name: Avaros
        run: >
          python tools/simulate.py --games 250 --seed 26093111
          --deck-size 30 --hand-size ${{ matrix.hand }}
          --disable-draw --command
          --no-between-battle-recycle --reshuffle-on-empty
          --deck-a decks/experiments/seven-name-avaros.json
          --deck-b decks/experiments/seven-name-avaros.json
          --agent-a heuristic --agent-b heuristic
          --output "artifacts/h${{ matrix.hand }}-empty-avaros.json"
      - name: Mara
        run: >
          python tools/simulate.py --games 250 --seed 26093112
          --deck-size 30 --hand-size ${{ matrix.hand }}
          --disable-draw --command
          --no-between-battle-recycle --reshuffle-on-empty
          --deck-a decks/experiments/seven-name-mara.json
          --deck-b decks/experiments/seven-name-mara.json
          --agent-a heuristic --agent-b heuristic
          --output "artifacts/h${{ matrix.hand }}-empty-mara.json"
      - name: Sera
        run: >
          python tools/simulate.py --games 250 --seed 26093113
          --deck-size 30 --hand-size ${{ matrix.hand }}
          --disable-draw --command
          --no-between-battle-recycle --reshuffle-on-empty
          --deck-a decks/experiments/seven-name-sera.json
          --deck-b decks/experiments/seven-name-sera.json
          --agent-a heuristic --agent-b heuristic
          --output "artifacts/h${{ matrix.hand }}-empty-sera.json"
      - uses: actions/upload-artifact@v4
        with:
          name: persistent-until-empty-h${{ matrix.hand }}
          path: artifacts/h${{ matrix.hand }}-empty-*.json
          retention-days: 30

  summarize:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: persistent-until-empty-*
          path: artifacts/all
          merge-multiple: true
      - name: Summarize
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("artifacts/all")
          pat=re.compile(r"h(\d+)-empty-(.+)\.json$")
          groups={}
          for p in root.glob("*.json"):
              m=pat.match(p.name)
              if not m: continue
              hand,_=m.groups()
              groups.setdefault(int(hand),[]).append(json.loads(p.read_text()))

          rows=[]
          for hand,rs in sorted(groups.items()):
              battles=sum(r["telemetry"]["battles"]["count"] for r in rs)
              games=sum(r["games"] for r in rs)
              def acts(name):
                  return sum(r["telemetry"]["actions"].get(name,0) for r in rs)
              comps=sum(
                  sum(v.get("completions",0) for v in r["telemetry"]["legend_combinations"].values())
                  for r in rs
              )
              dec=sum(r["telemetry"]["decisions"].get("heuristic",{}).get("decisions",0) for r in rs)
              choices=sum(
                  (r["telemetry"]["decisions"].get("heuristic",{}).get("mean_candidate_count") or 0)
                  * r["telemetry"]["decisions"].get("heuristic",{}).get("decisions",0)
                  for r in rs
              )/(dec or 1)
              def match_weight(field):
                  return sum(
                      (r["telemetry"]["depletion"].get(field) or 0)*r["games"]
                      for r in rs
                  )/games
              cont=sum(r["telemetry"]["battles"]["continuing_battles"] for r in rs)
              short=sum(
                  (r["telemetry"]["battles"]["next_battle_player_shortfall_rate"] or 0)
                  * r["telemetry"]["battles"]["continuing_battles"]
                  for r in rs
              )/(cont or 1)
              rows.append({
                  "hand":hand,
                  "games":games,
                  "battles":battles,
                  "names_per_battle":acts("PlayName")/battles,
                  "completions_per_battle":comps/battles,
                  "cycles_per_battle":acts("Cycle")/battles,
                  "cards_per_battle":sum(
                      acts(n) for n in (
                          "PlaySubject","PlayLink","PlayName",
                          "PlayPlot","PlayScheme","SetStratagem"
                      )
                  )/battles,
                  "choices":choices,
                  "hard_exhaustion":match_weight("player_game_deck_exhaustion_rate"),
                  "reshuffle_player_rate":match_weight("player_game_reshuffle_rate"),
                  "reshuffles_per_player_game":match_weight("mean_reshuffles_per_player_game"),
                  "refill_shortfall":short,
              })

          out=Path("artifacts/summary"); out.mkdir(parents=True,exist_ok=True)
          (out/"persistent-until-empty.json").write_text(json.dumps(rows,indent=2)+"\n")
          lines=[
              "# Persistent-until-empty sweep",
              "",
              "| Hand | Names/B | Target | Complete/B | Cycles/B | Cards/B | Choices | Hard exhaust | Players reshuffling | Reshuffles/player-game | Refill shortfall |",
              "| ---: | ---: | :---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |",
          ]
          for r in rows:
              lines.append(
                  f"| {r['hand']} | {r['names_per_battle']:.2f} "
                  f"| {'YES' if r['names_per_battle']>=3 else 'no'} "
                  f"| {r['completions_per_battle']:.2f} "
                  f"| {r['cycles_per_battle']:.2f} "
                  f"| {r['cards_per_battle']:.2f} "
                  f"| {r['choices']:.1f} "
                  f"| {r['hard_exhaustion']:.1%} "
                  f"| {r['reshuffle_player_rate']:.1%} "
                  f"| {r['reshuffles_per_player_game']:.2f} "
                  f"| {r['refill_shortfall']:.1%} |"
              )
          (out/"persistent-until-empty.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: persistent-until-empty-summary
          path: artifacts/summary/*
          retention-days: 30
