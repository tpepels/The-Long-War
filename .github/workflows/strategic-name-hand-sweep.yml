name: Strategic Name Hand Sweep

on:
  push:
    branches:
      - experiment/command-hand-deck-sweep
    paths:
      - ".github/workflows/strategic-name-hand-sweep.yml"

permissions:
  contents: read

jobs:
  simulate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: n6-h10, names: 6, hand: 10}
          - {id: n6-h11, names: 6, hand: 11}
          - {id: n6-h12, names: 6, hand: 12}
          - {id: n6-h13, names: 6, hand: 13}
          - {id: n7-h10, names: 7, hand: 10}
          - {id: n7-h11, names: 7, hand: 11}
          - {id: n7-h12, names: 7, hand: 12}
          - {id: n7-h13, names: 7, hand: 13}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Configure decks
        run: |
          if [ "${{ matrix.names }}" = "6" ]; then
            echo "REF_DECK=decks/experiments/name-rich-reference.json" >> "$GITHUB_ENV"
            echo "AVAROS_DECK=decks/experiments/name-rich-avaros.json" >> "$GITHUB_ENV"
            echo "MARA_DECK=decks/experiments/name-rich-mara.json" >> "$GITHUB_ENV"
            echo "SERA_DECK=decks/experiments/name-rich-sera.json" >> "$GITHUB_ENV"
          else
            echo "REF_DECK=decks/experiments/seven-name-reference.json" >> "$GITHUB_ENV"
            echo "AVAROS_DECK=decks/experiments/seven-name-avaros.json" >> "$GITHUB_ENV"
            echo "MARA_DECK=decks/experiments/seven-name-mara.json" >> "$GITHUB_ENV"
            echo "SERA_DECK=decks/experiments/seven-name-sera.json" >> "$GITHUB_ENV"
          fi
      - name: Reference
        run: >
          python tools/simulate.py --games 25 --seed 26093310
          --deck-size 30 --hand-size ${{ matrix.hand }}
          --disable-draw --command
          --deck-a "$REF_DECK" --deck-b "$REF_DECK"
          --agent-a strategic_heuristic --agent-b strategic_heuristic
          --strategic-belief-samples 2 --strategic-rollout-plies 3 --strategic-candidate-width 5
          --output "artifacts/${{ matrix.id }}-reference.json"
      - name: Avaros
        run: >
          python tools/simulate.py --games 25 --seed 26093311
          --deck-size 30 --hand-size ${{ matrix.hand }}
          --disable-draw --command
          --deck-a "$AVAROS_DECK" --deck-b "$AVAROS_DECK"
          --agent-a strategic_heuristic --agent-b strategic_heuristic
          --strategic-belief-samples 2 --strategic-rollout-plies 3 --strategic-candidate-width 5
          --output "artifacts/${{ matrix.id }}-avaros.json"
      - name: Mara
        run: >
          python tools/simulate.py --games 25 --seed 26093312
          --deck-size 30 --hand-size ${{ matrix.hand }}
          --disable-draw --command
          --deck-a "$MARA_DECK" --deck-b "$MARA_DECK"
          --agent-a strategic_heuristic --agent-b strategic_heuristic
          --strategic-belief-samples 2 --strategic-rollout-plies 3 --strategic-candidate-width 5
          --output "artifacts/${{ matrix.id }}-mara.json"
      - name: Sera
        run: >
          python tools/simulate.py --games 25 --seed 26093313
          --deck-size 30 --hand-size ${{ matrix.hand }}
          --disable-draw --command
          --deck-a "$SERA_DECK" --deck-b "$SERA_DECK"
          --agent-a strategic_heuristic --agent-b strategic_heuristic
          --strategic-belief-samples 2 --strategic-rollout-plies 3 --strategic-candidate-width 5
          --output "artifacts/${{ matrix.id }}-sera.json"
      - uses: actions/upload-artifact@v4
        with:
          name: strategic-name-${{ matrix.id }}
          path: artifacts/${{ matrix.id }}-*.json
          retention-days: 30

  summarize:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: strategic-name-*
          path: artifacts/all
          merge-multiple: true
      - name: Summarize
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("artifacts/all")
          pat=re.compile(r"n(6|7)-h(\d+)-(.+)\.json$")
          groups={}
          for p in root.glob("*.json"):
              m=pat.match(p.name)
              if not m: continue
              names,hand,_=m.groups()
              groups.setdefault((int(names),int(hand)),[]).append(json.loads(p.read_text()))
          rows=[]
          for (names,hand),rs in sorted(groups.items()):
              battles=sum(r["telemetry"]["battles"]["count"] for r in rs)
              acts=lambda n:sum(r["telemetry"]["actions"].get(n,0) for r in rs)
              comps=sum(sum(v.get("completions",0) for v in r["telemetry"]["legend_combinations"].values()) for r in rs)
              dec=sum(r["telemetry"]["decisions"].get("strategic_heuristic",{}).get("decisions",0) for r in rs)
              choices=sum(
                  (r["telemetry"]["decisions"].get("strategic_heuristic",{}).get("mean_candidate_count") or 0)
                  *r["telemetry"]["decisions"].get("strategic_heuristic",{}).get("decisions",0)
                  for r in rs
              )/(dec or 1)
              rows.append({
                  "names":names,"hand":hand,"games":sum(r["games"] for r in rs),"battles":battles,
                  "names_per_battle":acts("PlayName")/battles,
                  "completions_per_battle":comps/battles,
                  "cycles_per_battle":acts("Cycle")/battles,
                  "cards_per_battle":sum(acts(n) for n in ("PlaySubject","PlayLink","PlayName","PlayPlot","PlayScheme","SetStratagem"))/battles,
                  "choices":choices,
              })
          out=Path("artifacts/summary");out.mkdir(parents=True,exist_ok=True)
          (out/"strategic-name-hand.json").write_text(json.dumps(rows,indent=2)+"\n")
          lines=[
              "# Strategic Name/hand sweep","",
              "| Names/deck | Hand | Names/B | Target | Complete/B | Cycles/B | Cards/B | Choices |",
              "| ---: | ---: | ---: | :---: | ---: | ---: | ---: | ---: |",
          ]
          for r in rows:
              lines.append(
                  f"| {r['names']} | {r['hand']} | {r['names_per_battle']:.2f} "
                  f"| {'YES' if r['names_per_battle']>=3 else 'no'} "
                  f"| {r['completions_per_battle']:.2f} | {r['cycles_per_battle']:.2f} "
                  f"| {r['cards_per_battle']:.2f} | {r['choices']:.1f} |"
              )
          (out/"strategic-name-hand.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strategic-name-hand-summary
          path: artifacts/summary/*
          retention-days: 30
