name: Core 30 Balance Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/core-30-balance-baseline.yml"

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Verify native MCCFR
        run: make check-native-mccfr
      - name: Heuristic mirror self-play
        run: python tools/simulate.py --games 5000 --seed 26092201 --agent-a heuristic --agent-b heuristic --output artifacts/core30-heuristic.json
      - name: Health analysis
        run: python tools/analyze_telemetry.py --simulation artifacts/core30-heuristic.json --json-output artifacts/core30-health.json --markdown-output artifacts/core30-health.md
      - name: Cards-only paired counterfactuals
        run: python tools/counterfactual_balance.py --contexts 12 --games-per-context 10 --no-pairs --no-triples --bootstrap-resamples 1500 --seed 26092202 --output artifacts/core30-counterfactual.json
      - name: Train depth-3 MCCFR policy
        run: python tools/train_mccfr.py --iterations 5000 --depth 3 --workers 1 --seed 26092203 --output artifacts/core30-mccfr-policy.json
      - name: MCCFR mirror self-play
        run: python tools/simulate.py --games 1000 --seed 26092204 --agent-a mccfr --policy-a artifacts/core30-mccfr-policy.json --agent-b mccfr --policy-b artifacts/core30-mccfr-policy.json --output artifacts/core30-mccfr-selfplay.json
      - name: Print balance gate evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path("artifacts/core30-health.json").read_text())
          cf=json.loads(Path("artifacts/core30-counterfactual.json").read_text())
          m=json.loads(Path("artifacts/core30-mccfr-selfplay.json").read_text())
          g=health["global"]
          print("HEURISTIC FIRST PLAYER", g["first_player_win_rate"], g["first_player_win_rate_95"])
          print("HEALTH FLAGS", health["summary"]["flags_high"], health["summary"]["flags_watch"], health["summary"]["card_levels"])
          flagged=[(c["title"],[(f["code"],f["severity"],f.get("value")) for f in c["flags"]]) for c in health["cards"] if c["flags"]]
          print("FLAGGED CARDS", flagged)
          print("COUNTERFACTUAL TOP")
          for row in cf["cards"][:12]:
              print(row["title"], row["delta_win_probability"], row["ci95"], row["level"], row["direction"])
          print("MCCFR FIRST PLAYER", m["first_player_win_rate"])
          print("MCCFR POLICY SOURCES", m["telemetry"].get("policy_sources",{}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: core-30-balance-baseline
          path: artifacts/core30-*
          retention-days: 30
