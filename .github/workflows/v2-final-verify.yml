name: V2 final verification
on:
  push:
    branches:
      - design/v2-physical-cards
    paths:
      - .github/workflows/v2-final-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v2-physical-cards
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Install image decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils
      - run: pip install -e '.[dev]'
      - name: V2 renderer and browser-layout tests
        run: python -m pytest -q tests/test_v2_card_design.py tests/test_browser_card_layout.py
      - name: V2 physical layout and PDF
        run: python tools/check_card_layout.py --surface v2 --require-browser --pdf artifacts/print/cards-v2.pdf
      - name: Static and Pages build
        run: |
          python tools/check_web_static.py
          python tools/build_pages.py
          python tools/check_web_static.py --dist dist
          python tools/build_rulebook_pdf.py
